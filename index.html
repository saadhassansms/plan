    const A=aggregate(ui.from,ui.to);
    P.innerHTML=`<div class="pr-head"><div><h1>${T('تقرير المتابعة','Progress Report')}</h1><div class="s">${esc(C(state.title))}</div></div><div style="text-align:end"><b>${T(`من أسبوع ${ui.from} إلى أسبوع ${ui.to}`,`Week ${ui.from} to week ${ui.to}`)}</b><div class="s">${fmtD(weekStart(ui.from))} – ${rangeLabel(ui.to).split('– ')[1]}</div></div></div>
      ${dashBody(A,currentWeek(),false)}${allTimeLog()}<h2 class="pr-h2">${T(`مقارنة أسبوع ${ui.cmpA} مع أسبوع ${ui.cmpB}`,`Week ${ui.cmpA} vs week ${ui.cmpB}`)}</h2><div class="card">${compareTable(ui.cmpA,ui.cmpB)}</div>${foot}`;
  }
  document.body.classList.add('printing');
  P.classList.toggle('pr-week',kind==='week');P.classList.remove('one-page');
  if(kind==='week')fitPage(P,o,o.fit!=='multi');else fitPage(P,o,false);
  const done=()=>{document.body.classList.remove('printing');P.innerHTML='';P.classList.remove('one-page','pr-week');P.removeAttribute('style');if(prev)root.setAttribute('data-theme',prev);else root.removeAttribute('data-theme');render();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),60);
}

/* ============ cloud sync (GitHub Gist) ============ */
const SKEY=KEY+'-sync',FILE='weekly-plan.json',API='https://api.github.com';
let sync;try{sync=JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){sync={}}
let syncS='off',syncErr='',pushT=null,dirty=false,pulling=false,pushing=false;
const syncOn=()=>!!(sync.token&&sync.gist);
function saveSyncCfg(){try{localStorage.setItem(SKEY,JSON.stringify(sync))}catch(e){}}
function syncText(){
  if(!syncOn())return T('مش متزامن','Not synced');
  if(syncS==='busy')return T('جاري الحفظ…','Saving…');
  if(syncS==='err')return syncErr||T('في مشكلة في المزامنة','Sync problem');
  return T('متزامن','Synced');
}
function setSync(st,msg){syncS=st;syncErr=msg||'';
  const p=document.getElementById('syncPill');if(p){p.hidden=!syncOn();p.dataset.s=st;p.lastElementChild.textContent=syncText();p.title=syncText()}
  const x=document.getElementById('syncStatus');if(x){x.textContent=syncText();x.dataset.s=st}}
function errMsg(e){
  if(e&&e.status===401)return T('التوكن غلط أو انتهى، اعمل توكن جديد','Token is invalid or expired — create a new one');
  if(e&&e.status===403)return T('التوكن مالوش صلاحية gist','The token lacks the gist permission');
  if(e&&e.status===404)return T('ملف البيانات مش موجود','Data file not found');
  return T('مفيش إنترنت، هيتزامن لما يرجع','Offline — will sync when back online');
}
async function gh(path,opt={}){
  const r=await fetch(API+path,{...opt,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+sync.token,...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function findGist(){
  for(let page=1;page<=5;page++){const list=await gh(`/gists?per_page=100&page=${page}`);
    const g=list.find(x=>x.files&&x.files[FILE]);if(g)return g.id;if(list.length<100)break}
  return null;
}
async function readRemote(){
  const g=await gh('/gists/'+sync.gist),f=g.files&&g.files[FILE];if(!f)return null;
  let txt=f.content;if(f.truncated)txt=await (await fetch(f.raw_url,{cache:'no-store'})).text();
  return JSON.parse(txt);
}
function adopt(remote){
  state={...defaults(),...remote};if(migrateLayout(state)|migrateV4(state)|migrateStart()){state._t=Date.now();setTimeout(()=>schedulePush(),0)}
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  ui.week=Math.min(Math.max(ui.week,1),state.weeksCount);
  const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable))return; // don't wipe what you're typing
  render();
}
async function pushNow(){
  if(!syncOn()||pushing)return;clearTimeout(pushT);pushing=true;setSync('busy');
  try{await gh('/gists/'+sync.gist,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(state)}}})});
    dirty=false;setSync('ok')}
  catch(e){if(e.status===404){sync.gist='';saveSyncCfg()}setSync('err',errMsg(e))}
  finally{pushing=false;if(dirty){clearTimeout(pushT);pushT=setTimeout(pushNow,1500)}}
}
function schedulePush(){if(!syncOn())return;dirty=true;setSync('busy');clearTimeout(pushT);pushT=setTimeout(pushNow,1500)}
async function pull(){
  if(!syncOn()||pulling)return;
  if(dirty){pushNow();return}
  pulling=true;
  try{const r=await readRemote();
    if(r&&r.template&&(r._t||0)>(state._t||0))adopt(r);
    else if(!r||(state._t||0)>(r._t||0)){pulling=false;await pushNow();return}
    setSync('ok')}
  catch(e){setSync('err',errMsg(e))}
  finally{pulling=false}
}
async function connectSync(token){
  token=(token||'').trim();if(!token){toast(T('الصق التوكن الأول','Paste the token first'));return}
  sync={token};setSync('busy');
  try{
    const me=await gh('/user');sync.login=me.login;
    let id=await findGist(),found=!!id;
    if(!id){const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Weekly Plan — synced data',public:false,files:{[FILE]:{content:JSON.stringify(state)}}})});id=g.id}
    sync.gist=id;saveSyncCfg();
    if(found){const r=await readRemote();if(r&&r.template){adopt(r)}}
    setSync('ok');render();
    toast(found?T('اتربط وجاب بياناتك المحفوظة','Connected — your saved data was loaded'):T('اتربط، وأي تعديل هيتحفظ أونلاين','Connected — every change is now saved online'));
  }catch(e){sync={};saveSyncCfg();setSync('off');render();toast(errMsg(e))}
}
function disconnectSync(){if(!confirm(T('تفصل المزامنة على الجهاز ده؟ بياناتك الأونلاين مش هتتمسح.','Disconnect sync on this device? Your online data won’t be deleted.')))return;
  sync={};saveSyncCfg();setSync('off');render()}
function syncSection(){
  if(syncOn())return `<div class="sec"><h2>${T('المزامنة بين الأجهزة','Sync across devices')}</h2></div><div class="card">
    <p style="margin:0">${T('مربوط بحساب GitHub:','Connected to GitHub account:')} <b dir="ltr">${esc(sync.login||'')}</b> — <span id="syncStatus" data-s="${syncS}">${syncText()}</span></p>
    <p class="hint">${TP('أي تعديل بيتحفظ أونلاين تلقائياً بعد ثانيتين، ولما تفتح الصفحة من أي جهاز مربوط بنفس التوكن بتجيب آخر نسخة.','Every change is saved online automatically after a couple of seconds, and any device connected with the same token loads the latest version when opened.')}</p>
    <div class="syncbox"><button class="btn primary" data-act="syncnow">${T('زامن دلوقتي','Sync now')}</button><button class="btn danger" data-act="syncoff">${T('افصل الجهاز ده','Disconnect this device')}</button></div></div>`;
  return `<div class="sec"><h2>${T('المزامنة بين الأجهزة','Sync across devices')}</h2><span>${T('عشان تلاقي كل حاجة زي ما هي من أي جهاز','So everything stays the same on every device')}</span></div><div class="card">
    <ol class="steps">
      <li>${T('افتح','Open')} <a href="https://github.com/settings/tokens/new?scopes=gist&description=Weekly%20Plan" target="_blank" rel="noopener">${T('صفحة إنشاء التوكن على GitHub','GitHub’s token page')}</a> ${T('(صلاحية gist متعلّمة لوحدها)','(the gist permission is pre-selected)')}</li>
      <li>${T('من Expiration اختار No expiration أو مدة طويلة، وبعدين Generate token','Set Expiration to “No expiration” or a long period, then click Generate token')}</li>
      <li>${T('انسخ التوكن والصقه هنا. على أي جهاز تاني الصق نفس التوكن مرة واحدة بس.','Copy the token and paste it here. On any other device, paste the same token once.')}</li>
    </ol>
    <div class="syncbox"><input type="password" id="ghTok" placeholder="ghp_…" autocomplete="off" dir="ltr"><button class="btn primary" data-act="synccon">${T('اربط','Connect')}</button></div>
    <p class="hint">${TP('البيانات بتتحفظ في Gist سري على حسابك، مش بيظهر في البحث ولا في الريبو بتاع الصفحة. التوكن بيتحفظ في المتصفح ده بس، ومش بيدخل في النسخة الاحتياطية.','Data is stored in a secret Gist on your account — it doesn’t appear in search or in the page’s repo. The token is stored only in this browser and is never included in backups.')}</p></div>`;
}
document.addEventListener('visibilitychange',()=>{if(!syncOn())return;if(document.visibilityState==='visible')pull();else if(dirty)pushNow()});
window.addEventListener('online',()=>{if(syncOn())pull()});
setInterval(()=>{if(syncOn()&&document.visibilityState==='visible'&&!dirty)pull()},60000);

render();
if(syncOn()){setSync('busy');pull()}
</script>
