<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الجدول الأسبوعي والمتابعة السنوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F8; --sheet:#FFFFFF; --ink:#161C34; --ink-soft:#4B5270; --line:#E3E6EE; --line-2:#EEF0F5; --muted:#858BA3;
  --good:#16794F; --mid:#A8741A; --bad:#B23A3A; --empty:#EEF0F5;
  --acc:#1C2E6B; --acc2:#E8C468; --acc-t:var(--acc);
  --shadow:0 1px 2px rgba(22,28,52,.05),0 4px 16px rgba(22,28,52,.04);
  --r:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0E1120; --sheet:#161A2D; --ink:#E9EBF5; --ink-soft:#B3B8D3; --line:#272C46; --line-2:#1F2439; --muted:#8B91B2;
  --good:#5CCB98; --mid:#E5B65A; --bad:#F08A84; --empty:#20253B; --acc-t:color-mix(in srgb,var(--acc) 40%,#fff);
  --shadow:none;
}}
:root[data-theme="dark"]{
  --paper:#0E1120; --sheet:#161A2D; --ink:#E9EBF5; --ink-soft:#B3B8D3; --line:#272C46; --line-2:#1F2439; --muted:#8B91B2;
  --good:#5CCB98; --mid:#E5B65A; --bad:#F08A84; --empty:#20253B; --acc-t:color-mix(in srgb,var(--acc) 40%,#fff);
  --shadow:none;
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif;line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.display{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--acc);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;inset:0;background:var(--pat);opacity:.35}
.brand-mark span{position:relative;z-index:1;width:14px;height:14px;border-radius:4px;background:var(--acc2)}
#hTitle{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-weight:700;font-size:1.15rem;margin:0;line-height:1.3}
#hSub{margin:0;color:var(--muted);font-size:.8rem;line-height:1.4}
.edit-head #hTitle,.edit-head #hSub{outline:1.5px dashed var(--acc2);outline-offset:3px;border-radius:5px;cursor:text}
.edit-head #hTitle:focus,.edit-head #hSub:focus{outline-style:solid}
.tabs{display:flex;gap:2px;background:var(--empty);padding:4px;border-radius:12px}
.tabs button{background:none;border:none;padding:7px 14px;border-radius:9px;font-weight:500;font-size:.88rem;color:var(--ink-soft);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(22,28,52,.12)}

.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 72px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--acc);color:#fff;padding:26px 28px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px 30px;align-items:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.16;z-index:-1;-webkit-mask-image:linear-gradient(to left,#000 10%,transparent 85%);mask-image:linear-gradient(to left,#000 10%,transparent 85%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(0,0,0,.22));z-index:-1}
.deco{position:absolute;z-index:-1;pointer-events:none}
.deco.circle{width:300px;height:300px;border-radius:50%;border:46px solid var(--acc2);opacity:.2;left:-90px;bottom:-150px}
.deco.square{width:190px;height:190px;border:30px solid var(--acc2);opacity:.18;left:-30px;top:-70px;transform:rotate(28deg);border-radius:18px}
.deco.arc{width:340px;height:340px;border-radius:50%;border:2px solid var(--acc2);opacity:.45;left:-140px;top:-160px;box-shadow:0 0 0 26px color-mix(in srgb,var(--acc2) 14%,transparent),0 0 0 60px color-mix(in srgb,var(--acc2) 8%,transparent)}
.wk{display:flex;align-items:center;gap:16px}
.wk-num{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-weight:700;font-size:4.2rem;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wk-num small{display:block;font-family:"Readex Pro",sans-serif;font-size:.78rem;font-weight:400;letter-spacing:0;opacity:.75;margin-top:8px}
.wk-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-range{font-size:1.25rem;font-weight:600}
.wk-theme{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;opacity:.85}
.wk-theme i{width:10px;height:10px;border-radius:3px;background:var(--acc2)}
.wk-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.hbtn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;padding:0}
.hbtn:hover:not(:disabled){background:rgba(255,255,255,.2)}
.hbtn:disabled{opacity:.35;cursor:default}
.hsel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:7px 12px;width:auto;min-width:240px;max-width:100%;font-size:.86rem;field-sizing:content}
.hsel option{color:#161C34;background:#fff}
.hpill{border:1px solid rgba(255,255,255,.35);background:var(--acc2);color:var(--acc);border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:600}
.rings{display:flex;gap:18px}
.ring{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px}
.ring svg{width:76px;height:76px}
.ring .bg{fill:none;stroke:rgba(255,255,255,.18);stroke-width:7}
.ring .fg{fill:none;stroke:var(--acc2);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;top:24px;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.ring span{font-size:.76rem;opacity:.85}

/* ---------- quote ---------- */
.quote{position:relative;margin:16px 0 0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 30px 20px;box-shadow:var(--shadow);overflow:hidden;isolation:isolate}
.quote::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)))}
.quote::after{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.05;z-index:-1;filter:invert(1)}
.q-mark{position:absolute;left:22px;top:-26px;font-family:"Amiri",serif;font-size:9rem;line-height:1;color:var(--acc2);opacity:.55;z-index:-1}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.q-label{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-weight:700;font-size:.85rem;color:var(--acc-t);display:inline-flex;align-items:center;gap:8px}
.q-label::before{content:"";width:8px;height:8px;background:var(--acc2);transform:rotate(45deg);border-radius:1px}
.q-count{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.quote blockquote{margin:0;font-family:"Amiri","Noto Kufi Arabic",serif;font-weight:700;font-size:28px;line-height:1.8;color:var(--ink);width:100%;overflow:hidden}
.quote blockquote[contenteditable="true"]{outline:1.5px dashed var(--acc2);outline-offset:6px;border-radius:6px;cursor:text;white-space:normal!important;font-size:22px!important}
.quote blockquote[contenteditable="true"]:focus{outline-style:solid}
.q-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.q-edit .hint{flex-basis:100%}
.q-nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.qbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;padding:0;color:var(--ink-soft)}
.qbtn svg{width:15px;height:15px}
.qbtn:hover{border-color:var(--acc-t);color:var(--acc-t)}
.q-dots{display:flex;gap:5px}
.q-dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.q-dots i.on{width:18px;background:var(--acc)}
.qrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.qrow textarea{min-height:64px;font-family:"Amiri",serif;font-size:1.05rem}
/* ---------- log ---------- */
.tag{display:inline-block;font-size:.72rem;border-radius:10px;padding:1px 9px}
.tag.on{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.off{background:var(--empty);color:var(--ink-soft)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 14px}
.toolbar .grow{flex:1}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:9px;font-size:.86rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--sheet);border:1px solid var(--line);border-radius:11px;padding:8px 14px;font-size:.86rem;font-weight:500;transition:border-color .15s,background .15s}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover:not(:disabled){border-color:var(--acc-t)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.on{background:var(--acc2);color:var(--acc);border-color:var(--acc2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:9px}
.btn.ghost{background:none}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 11px;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--acc-t);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-soft)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.custom i{background:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 30%,transparent)}

/* ---------- edit panel ---------- */
.editpanel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.ep-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:color-mix(in srgb,var(--acc2) 16%,var(--sheet));border-bottom:1px solid var(--line);font-weight:600;font-size:.9rem}
.ep-head i{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
.ep-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.ep-row:last-child{border-bottom:none}
.ep-label{font-size:.82rem;color:var(--muted);min-width:110px}
.radio-seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.radio-seg label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.86rem}
.radio-seg label:has(input:checked){border-color:var(--acc-t);background:color-mix(in srgb,var(--acc) 8%,var(--sheet));color:var(--acc-t);font-weight:500}
.radio-seg input{accent-color:var(--acc)}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;padding:0;background:linear-gradient(135deg,var(--a) 0 62%,var(--b) 62% 100%);position:relative}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--sheet) inset}
.sw-auto{height:34px;border-radius:10px;border:1px dashed var(--line);background:none;padding:0 12px;font-size:.8rem;color:var(--ink-soft)}
.sw-auto[aria-pressed="true"]{border-style:solid;border-color:var(--ink);color:var(--ink)}
.hint{font-size:.82rem;color:var(--muted);margin:0}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.legend>span{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-soft);background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 10px}
.legend i{width:9px;height:9px;border-radius:50%}
.star{color:var(--mid);font-size:.78rem;margin-inline-start:4px}

/* ---------- week table ---------- */
.board{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.scroller{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:0;width:100%;min-width:1040px;table-layout:fixed}
.tt th,.tt td{padding:6px;vertical-align:top;border-bottom:1px solid var(--line-2)}
.tt td+td,.tt th+td,.tt th+th{border-inline-start:1px solid var(--line-2)}
.tt thead th{padding:14px 6px 12px;text-align:center;font-weight:600;font-size:.92rem;background:var(--sheet);border-bottom:1px solid var(--line)}
.tt thead th small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.tt thead th.is-today{background:var(--acc);color:#fff;border-radius:12px 12px 0 0;position:relative}
.tt thead th.is-today small{color:rgba(255,255,255,.8)}
.today-chip{display:inline-block;margin-top:5px;background:var(--acc2);color:var(--acc);font-size:.7rem;font-weight:700;border-radius:20px;padding:1px 10px}
.tt .time{width:112px;text-align:start;padding:12px 14px;background:color-mix(in srgb,var(--empty) 55%,var(--sheet))}
.tt .time b{display:block;font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums}
.tt .time .to{display:block;font-size:.78rem;color:var(--muted)}
.tt .time .du{display:inline-block;margin-top:6px;font-size:.7rem;color:var(--ink-soft);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:0 8px}
.tt td.is-today{background:color-mix(in srgb,var(--acc) 7%,var(--sheet));box-shadow:inset 2px 0 0 var(--acc),inset -2px 0 0 var(--acc)}
.tt tfoot td.is-today{box-shadow:inset 2px 0 0 var(--acc),inset -2px 0 0 var(--acc),inset 0 -2px 0 var(--acc)}
.tt td.is-today .slot{box-shadow:0 2px 8px color-mix(in srgb,var(--acc) 18%,transparent)}
.tt tfoot td,.tt tfoot th{text-align:center;padding:10px 6px;border-bottom:none;border-top:1px solid var(--line)}
.tt tfoot th.time{font-size:.8rem;color:var(--ink-soft);font-weight:500}
.minibar{height:6px;border-radius:4px;background:var(--empty);overflow:hidden;margin:0 10px 5px}
.minibar i{display:block;height:100%;background:var(--acc)}
.tt tfoot span{font-size:.76rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* slot (shape depends on week theme) */
.slot{--c:#888;position:relative;display:block;width:100%;min-height:76px;text-align:right;border:none;padding:10px 10px 10px 10px;color:var(--ink);
  background:color-mix(in srgb,var(--c) 9%,var(--sheet));border-radius:12px;border-inline-start:4px solid var(--c);transition:background .15s,transform .1s}
.slot b{display:block;font-weight:600;font-size:14px;line-height:1.4;color:color-mix(in srgb,var(--c) 75%,var(--ink));padding-left:22px}
.slot b,.slot em{white-space:nowrap;overflow:hidden;text-align:right}
.slot em{unicode-bidi:plaintext}
.slot em{font-style:normal;display:block;font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.slot .tick{position:absolute;top:10px;left:8px;width:18px;height:18px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);display:grid;place-items:center;font-style:normal;font-size:.62rem;color:transparent;transition:background .15s}
.slot:hover{background:color-mix(in srgb,var(--c) 15%,var(--sheet))}
.slot:active{transform:scale(.985)}
.slot.done{background:color-mix(in srgb,var(--c) 22%,var(--sheet))}
.slot.done .tick{background:var(--c);border-color:var(--c);color:#fff}
.slot.done b{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,var(--c) 50%,transparent)}
[data-shape="sharp"] .slot{border-radius:4px;border-inline-start:none;box-shadow:inset 0 3px 0 var(--c)}
[data-shape="pill"] .slot{border-radius:20px;border-inline-start:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 40%,transparent)}
[data-shape="notch"] .slot{border-radius:0;border-inline-start:none;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);box-shadow:inset -3px 0 0 var(--c)}
[data-shape="tab"] .slot{border-radius:14px 3px 14px 3px;border-inline-start:3px solid var(--c)}
.edit-on .slot{outline:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent);outline-offset:-3px}
.edit-on .slot .tick{display:none}
.addcell{width:100%;min-height:76px;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--muted);font-size:.8rem}
.addcell:hover{border-color:var(--acc-t);color:var(--acc-t)}
.tedit{display:flex;flex-direction:column;gap:5px}
.tedit label{display:flex;flex-direction:column;font-size:.7rem;color:var(--muted);gap:2px}
.tedit input{padding:4px 6px;font-size:.8rem;width:100%}
.tedit .del{background:none;border:none;color:var(--bad);font-size:.74rem;padding:2px;text-align:start}
.addrowcell{padding:10px!important;background:var(--sheet)!important}
.addrowbtn{width:100%;border:1.5px dashed color-mix(in srgb,var(--acc) 40%,var(--line));background:color-mix(in srgb,var(--acc) 4%,var(--sheet));color:var(--acc-t);border-radius:12px;padding:12px;font-weight:500}

/* ---------- day view ---------- */
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.daychip{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.daychip b{font-size:.84rem;font-weight:600}
.daychip span{font-size:.7rem;color:var(--muted)}
.daychip .dp{width:70%;height:4px;border-radius:3px;background:var(--empty);overflow:hidden;margin-top:4px}
.daychip .dp i{display:block;height:100%;background:var(--acc)}
.daychip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.daychip[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.daychip[aria-pressed="true"] .dp{background:rgba(255,255,255,.25)}
.daychip[aria-pressed="true"] .dp i{background:var(--acc2)}
.daychip.today{position:relative}
.daychip.today::before{content:"النهارده";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--acc2);color:var(--acc);font-size:.62rem;font-weight:700;border-radius:10px;padding:0 7px;white-space:nowrap}
.daychip.today:not([aria-pressed="true"]){border-color:var(--acc-t);border-width:2px}
.daychips{padding-top:8px}
.timeline{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:8px 16px;box-shadow:var(--shadow)}
.tl-row{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:stretch}
.tl-row:last-child{border-bottom:none}
.tl-time{position:relative;padding-inline-start:16px}
.tl-time::before{content:"";position:absolute;inset-inline-start:0;top:6px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.tl-time::after{content:"";position:absolute;inset-inline-start:4px;top:20px;bottom:-14px;width:1px;background:var(--line)}
.tl-row:last-child .tl-time::after{display:none}
.tl-time b{display:block;font-size:.9rem;font-variant-numeric:tabular-nums}
.tl-time span{font-size:.75rem;color:var(--muted);white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- cards & sections ---------- */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 12px;flex-wrap:wrap}
.sec h2{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.08rem;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--acc)}
.sec span{font-size:.82rem;color:var(--muted)}
h3{font-size:.95rem;font-weight:600;margin:0 0 14px}

/* todos */
.todo{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2)}
.todo:last-of-type{border-bottom:none}
.todo .tt-t{flex:1;font-size:.92rem;unicode-bidi:plaintext;text-align:right}
.todo.done .tt-t{text-decoration:line-through;color:var(--muted)}
.dtag{font-size:.72rem;color:var(--acc-t);background:color-mix(in srgb,var(--acc) 8%,var(--sheet));border-radius:12px;padding:2px 10px;white-space:nowrap}
.todoadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.todoadd input{flex:1;min-width:200px}
.xbtn{background:none;border:none;color:var(--muted);font-size:.9rem;padding:4px 8px;border-radius:8px}
.xbtn:hover{color:var(--bad);background:var(--empty)}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--acc-t)}
.chk:checked{background:var(--acc);border-color:var(--acc)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* habits */
table.ht{border-collapse:separate;border-spacing:0;width:100%;min-width:700px}
.ht th,.ht td{border-bottom:1px solid var(--line-2);padding:12px 8px;text-align:center}
.ht tbody tr:last-child td{border-bottom:none}
.ht th:first-child,.ht td:first-child{text-align:start;padding-inline-start:20px}
.ht thead th{font-weight:600;font-size:.85rem;border-bottom:1px solid var(--line)}
.ht thead th small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.ht thead th.is-today{background:var(--acc);color:#fff;border-radius:10px 10px 0 0}
.ht thead th.is-today small{color:rgba(255,255,255,.8)}
.ht td.is-today{background:color-mix(in srgb,var(--acc) 7%,var(--sheet));box-shadow:inset 2px 0 0 var(--acc),inset -2px 0 0 var(--acc)}
.ht td b,.ht td small{font-weight:600;unicode-bidi:plaintext;text-align:right}
.ht td small{font-weight:400}
.ht td small{display:block;color:var(--muted);font-size:.76rem}
.ht .chk{border-radius:50%;width:28px;height:28px}
.addhabit{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--empty) 50%,var(--sheet))}
.addhabit input{flex:1;min-width:160px}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.7}

/* pills */
.pill{display:inline-block;min-width:44px;padding:2px 9px;border-radius:10px;font-weight:600;font-size:.76rem;font-variant-numeric:tabular-nums}
.p-good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.p-mid{background:color-mix(in srgb,var(--mid) 16%,transparent);color:var(--mid)}
.p-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}

/* ---------- dashboard ---------- */
.rangebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;box-shadow:var(--shadow)}
.rangebar .lbl{font-size:.84rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi.lead{background:var(--acc);color:#fff;border-color:var(--acc);position:relative;overflow:hidden;isolation:isolate}
.kpi.lead::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.14;z-index:-1}
.kpi.lead span{color:rgba(255,255,255,.8)}
.kpi b{display:block;font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.75rem;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.hbar{display:grid;grid-template-columns:120px 1fr 96px;gap:12px;align-items:center;font-size:.86rem;margin-bottom:11px}
.hbar .tr{position:relative;height:10px;background:var(--empty);border-radius:6px;overflow:hidden}
.hbar .tr i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px}
.hbar .tr i.p{opacity:.22}
.hbar span:last-child{text-align:end;color:var(--ink-soft);font-size:.78rem;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(13,minmax(0,46px));gap:6px;justify-content:start}
.heat button{aspect-ratio:1;border-radius:8px;border:none;font-size:.68rem;padding:0;color:var(--ink-soft);background:var(--empty);font-variant-numeric:tabular-nums;position:relative}
.heat button.l1{background:color-mix(in srgb,var(--a) 22%,var(--sheet));color:var(--ink)}
.heat button.l2{background:color-mix(in srgb,var(--a) 48%,var(--sheet));color:#fff}
.heat button.l3{background:color-mix(in srgb,var(--a) 75%,var(--sheet));color:#fff}
.heat button.l4{background:var(--a);color:#fff}
.heat button.fut{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.heat button.inr::after{content:"";position:absolute;inset:-3px;border-radius:10px;border:1.5px solid var(--acc2)}
.heat button.cur{font-weight:700;box-shadow:inset 0 0 0 2px var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:"Readex Pro",sans-serif}
table.dt{width:100%;border-collapse:collapse;font-size:.86rem}
.dt th,.dt td{padding:11px 8px;border-bottom:1px solid var(--line-2);text-align:center}
.dt tbody tr:last-child td{border-bottom:none}
.dt th:first-child,.dt td:first-child{text-align:start}
.dt thead th{color:var(--muted);font-weight:500;font-size:.78rem;border-bottom:1px solid var(--line)}
.dt .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.insights{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.insights li{display:flex;gap:12px;align-items:flex-start;line-height:1.7}
.insights li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--acc2);margin-top:10px;transform:rotate(45deg)}
.up{color:var(--good);font-weight:600} .down{color:var(--bad);font-weight:600}
.keys{display:flex;gap:16px;font-size:.8rem;color:var(--ink-soft);margin-bottom:10px;flex-wrap:wrap}
.keys i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}

/* ---------- settings ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--ink-soft)}
.catrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.catrow input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--sheet)}
.catrow input[type=text]{flex:1;min-width:160px}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sheet)}
.tcard .tp{height:62px;background:var(--a);position:relative;overflow:hidden}
.tcard .tp::before{content:"";position:absolute;inset:0;background-image:var(--tp);opacity:.22}
.tcard .tp::after{content:"";position:absolute;width:30px;height:30px;border-radius:8px;background:var(--b);bottom:10px;left:12px}
.tcard div:last-child{padding:8px 12px;font-size:.8rem}

/* ---------- dialog & toast ---------- */
dialog{border:none;border-radius:20px;padding:0;background:var(--sheet);color:var(--ink);width:min(470px,92vw);box-shadow:0 24px 70px rgba(10,15,40,.3)}
dialog::backdrop{background:rgba(14,17,32,.5);backdrop-filter:blur(2px)}
.dlg-in{padding:24px}
.dlg-in h3{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.05rem;margin-bottom:16px}
.dlg-in .form{grid-template-columns:1fr}
.dlg-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
.dlg-act .danger{margin-inline-end:auto}
.ck{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important}
.ck input{accent-color:var(--acc);width:17px;height:17px}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- print ---------- */
#printArea{display:none}
.pr-head{position:relative;overflow:hidden;background:var(--acc);color:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;isolation:isolate}
.pr-head::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.16;z-index:-1}
.pr-head h1{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.5rem;margin:0}
.pr-head .s{opacity:.85;font-size:.85rem}
.pr-foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft)}
.pr-h2{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1rem;margin:16px 0 8px}
@media print{
  @page{size:A4 landscape;margin:9mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11px}
  body.printing .appbar,body.printing .wrap,body.printing dialog,body.printing .toast{display:none!important}
  body.printing #printArea{display:block}
  .board,.card,.kpi{box-shadow:none}
  .scroller{overflow:visible}
  table.tt,table.ht{min-width:0}
  .slot{min-height:52px;padding:6px 7px}
  .card,.kpi,.tt tr,.hbar,.board,.quote{break-inside:avoid}
  .quote{padding:12px 20px}.quote blockquote{font-size:1.15rem}.q-mark{font-size:6rem}
  .no-print{display:none!important}
  .grid2{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:22px}
  .rings{justify-content:space-between}
  .appbar-in{padding:10px 14px}
  .tabs{width:100%;overflow-x:auto}
  .tabs button{flex:1;white-space:nowrap;padding:7px 10px}
  .wrap{padding:16px 12px 64px}
}
@media (max-width:560px){
  .wk-num{font-size:3.3rem}
  .ring,.ring svg{width:64px}.ring svg{height:64px}.ring b{top:20px;font-size:.9rem}
  .hbar{grid-template-columns:88px 1fr 76px}
  .heat{grid-template-columns:repeat(7,minmax(0,1fr))}
  .wk-ctl{flex-wrap:nowrap}.hsel{flex:1;min-width:0;field-sizing:fixed}
  .daychip b{font-size:.74rem}.daychip span{display:none}
  .tl-row{grid-template-columns:74px 1fr;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header class="appbar"><div class="appbar-in">
  <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span></div>
    <div id="headBox"><h1 id="hTitle"></h1><p id="hSub"></p></div></div>
  <nav class="tabs" role="tablist" aria-label="الأقسام">
    <button role="tab" data-tab="schedule">الجدول</button>
    <button role="tab" data-tab="habits">العادات</button>
    <button role="tab" data-tab="dash">الداشبورد والتقارير</button>
    <button role="tab" data-tab="settings">الإعدادات</button>
  </nav>
</div></header>
<div class="wrap"><main id="main"></main></div>
<div id="printArea"></div>
<dialog id="dlg"><div class="dlg-in"><h3 id="dlgT"></h3><div id="dlgB"></div><div class="dlg-act" id="dlgA"></div></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>

/* ============ data ============ */
const KEY='weekly-planner-52-v1';
const DAYS=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const DAY_MS=864e5;
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function saturdayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x}

const DEFAULT_QUOTES=[
  'حريٌّ بك أن تتذكّر أن السعي لطلب العلم هو توفيقٌ من الله، ورزقٌ ساقه إليك.',
  'الانتفاع بالعلم فتحٌ من الله ومِنّة، لذلك لا بد من تجديد النية، وإظهار الحاجة والافتقار إلى المولى سبحانه.',
  'تخلّص من كل فكرةٍ تُشعرك أن ما تقوم به هو من حولك وقوتك، وإيّاك أن تُعجب بنفسك.',
  'طريق العلم طريقٌ محفوفٌ بالابتلاءات وقواطع الطريق، لذلك فأنت تحتاج إلى الصبر والمجاهدة.',
  'قد يُحرم المرء فضل العلم ويُحجب عنه بسبب ذنب، فلا يفارقنّ لسانك الاستغفار.',
  'الدعاء من أقوى الأسلحة، فلا تفتر أن تدعو الله أن يشرح صدرك، وينفعك بهذا العلم، ويوفقك للعمل الصالح، وأن تكون من أهل الجنة.'
];
function defaults(){
  const C=(t,s,c,star)=>({t,s,c,star:!!star});
  const all=x=>Array.from({length:7},()=>({...x}));
  return {
    title:'الجدول الأسبوعي', subtitle:'قرآن ومهارات ومحاسبة، كل يوم بخطوة ثابتة',
    owner:'', fixedTheme:'', start:'2026-10-10', startV:2,
    quotesTitle:'وصايا غالية', quotes:DEFAULT_QUOTES.slice(), weeksCount:52, theme:'auto',
    cats:[
      {id:'q',name:'القرآن والذكر',color:'#1E6B50'},
      {id:'t',name:'المهارات التقنية',color:'#2563A8'},
      {id:'a',name:'المحاسبة والشهادات',color:'#7B3A68'},
      {id:'f',name:'مراجعة',color:'#8A90A8'}
    ],
    template:{
      slots:[
        {id:'s1',start:'05:30',end:'07:00'},
        {id:'s2',start:'18:00',end:'19:00'},
        {id:'s3',start:'19:15',end:'20:45'},
        {id:'s4',start:'21:00',end:'22:00'},
        {id:'s5',start:'22:00',end:'22:45'}
      ],
      cells:{
        s1:all(C('حفظ القرآن','حفظ + أذكار + نفع','q')),
        s2:[C('Excel','دوال، Pivot، Power Query','t'),C('AI','أدوات الذكاء الاصطناعي في الشغل','t',1),C('IQ','تمارين منطق وتحليل','t',1),
            C('Power BI','نماذج بيانات و DAX','t'),C('AI','تطبيق عملي ومشروع صغير','t',1),C('ERP Odoo','محاسبة وتقارير Odoo','t'),C('IQ','اختبار ومراجعة','t',1)],
        s3:all(C('CMA','مذاكرة + أسئلة MCQ','a')),
        s4:all(C('Accounting 101','أساسيات + حل تمارين','a')),
        s5:[C('IFRS','معيار جديد','a'),C('Entrepreneurship','قراءة + أفكار','a'),C('IFRS','حالات عملية','a'),
            C('مراجعة','تلخيص الأسبوع','f'),C('IFRS','مراجعة المعايير','a'),C('Entrepreneurship','تطبيق على فكرة','a'),C('مراجعة وتخطيط','تجهيز الأسبوع الجاي','f')]
      }
    },
    habits:[
      {id:'h1',name:'القراءة',desc:'ولو 15 صفحة في اليوم',from:1},
      {id:'h2',name:'مفيش سوشيال ميديا',desc:'بدون تصفح عشوائي',from:1},
      {id:'h3',name:'تدوين اليوميات',desc:'دقائق في آخر اليوم',from:1},
      {id:'h4',name:'غض البصر',desc:'طول اليوم',from:1}
    ],
    weeks:{}
  };
}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}
if(!state||!state.template){state=defaults()}else{const raw=state;state={...defaults(),...raw};
  if(raw.owner==='Mohamed Ghaith'){state.owner='';try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  if(raw.startV!==2){state.start='2026-10-10';state.startV=2;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('تعذّر الحفظ في المتصفح، اعمل نسخة احتياطية من الإعدادات')}}

/* ============ helpers ============ */
function currentWeek(){const s=parseISO(state.start);const n=Math.floor((new Date()-s)/DAY_MS/7)+1;return Math.min(Math.max(n,1),state.weeksCount)}
function isThisWeek(n){const a=weekStart(n),now=new Date();return now>=a&&now<new Date(a.getTime()+7*DAY_MS)}
function daysToStart(){return Math.ceil((parseISO(state.start)-new Date())/DAY_MS)}
function weekStart(n){const d=parseISO(state.start);d.setDate(d.getDate()+(n-1)*7);return d}
const fmtD=d=>d.toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short'});
function rangeLabel(n){const a=weekStart(n),b=new Date(a);b.setDate(b.getDate()+6);return `${fmtD(a)} – ${fmtD(b)}`}
function dayDate(n,i){const d=weekStart(n);d.setDate(d.getDate()+i);return fmtD(d)}
function todayIdx(){return (new Date().getDay()+1)%7}
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function dur(s){let d=toMin(s.end)-toMin(s.start);if(d<=0)d+=1440;return d}
function fmt12(t){const [h,m]=t.split(':').map(Number);return `${h%12||12}:${pad(m)} ${h<12?'ص':'م'}`}
function durLabel(m){if(m%60===0)return m===60?'ساعة':m===120?'ساعتين':`${m/60} ساعات`;if(m===90)return 'ساعة ونص';if(m<60)return `${m} دقيقة`;return `${Math.floor(m/60)} س و ${m%60} د`}
const hrs=m=>{const v=Math.round(m/6)/10;return String(v)};
const catOf=id=>state.cats.find(c=>c.id===id)||{id:'',name:'بدون تصنيف',color:'#8A90A8'};
const getWeek=(n,create)=>{if(!state.weeks[n]&&create)state.weeks[n]={plan:null,done:{},habits:{},note:''};return state.weeks[n]};
const getPlan=n=>(state.weeks[n]&&state.weeks[n].plan)||state.template;
const habitsFor=n=>state.habits.filter(h=>(h.from||1)<=n&&(!h.to||n<=h.to));
const pctClass=p=>p>=80?'p-good':p>=50?'p-mid':'p-bad';
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function applyTheme(){const r=document.documentElement;if(state.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',state.theme)}

/* keep past weeks frozen before master edits so the dashboard stays accurate */
function freezePast(upTo){const snap=JSON.stringify(state.template);
  for(let n=1;n<=state.weeksCount;n++){if(n===upTo)continue;const w=state.weeks[n];
    const tracked=w&&Object.keys(w.done||{}).length>0;
    if(n<upTo||tracked){const x=getWeek(n,true);if(!x.plan)x.plan=JSON.parse(snap)}}}
function doneInSlot(n,id){const w=state.weeks[n];return w?Object.keys(w.done||{}).filter(k=>k.startsWith(id+'_')).length:0}
function editablePlan(){
  if(ui.scope==='week'){const w=getWeek(ui.week,true);if(!w.plan)w.plan=clone(state.template);return w.plan}
  freezePast(ui.week);const w=state.weeks[ui.week];if(w&&w.plan)return w.plan;return state.template;
}

/* ============ stats ============ */
function weekStats(n){
  const plan=getPlan(n),w=state.weeks[n]||{done:{},habits:{}};
  const r={n,pMin:0,dMin:0,pCnt:0,dCnt:0,cat:{},subj:{},day:Array.from({length:7},()=>({p:0,d:0})),hP:0,hD:0,hab:{}};
  plan.slots.forEach(s=>{const m=dur(s);(plan.cells[s.id]||[]).forEach((c,i)=>{
    if(!c||!c.t)return;const d=!!(w.done||{})[s.id+'_'+i];
    r.pMin+=m;r.pCnt++;if(d){r.dMin+=m;r.dCnt++}
    const cc=r.cat[c.c]||(r.cat[c.c]={p:0,d:0});cc.p+=m;if(d)cc.d+=m;
    const k=c.t.trim();const ss=r.subj[k]||(r.subj[k]={cat:c.c,p:0,d:0,pc:0,dc:0});ss.p+=m;ss.pc++;if(d){ss.d+=m;ss.dc++}
    r.day[i].p+=m;if(d)r.day[i].d+=m;})});
  habitsFor(n).forEach(h=>{let c=0;for(let i=0;i<7;i++)if((w.habits||{})[h.id+'_'+i])c++;r.hab[h.id]=c;r.hD+=c;r.hP+=7});
  const td=w.todos||[];r.tP=td.length;r.tD=td.filter(t=>t.done).length;
  r.pct=r.pMin?Math.round(r.dMin/r.pMin*100):0;r.hPct=r.hP?Math.round(r.hD/r.hP*100):0;
  return r;
}
function aggregate(from,to){
  const A={pMin:0,dMin:0,pCnt:0,dCnt:0,cat:{},subj:{},day:Array.from({length:7},()=>({p:0,d:0})),hP:0,hD:0,tP:0,tD:0,hab:{},weeks:[]};
  for(let n=from;n<=to;n++){const r=weekStats(n);A.weeks.push(r);
    ['pMin','dMin','pCnt','dCnt','hP','hD','tP','tD'].forEach(k=>A[k]+=r[k]);
    for(const k in r.cat){const a=A.cat[k]||(A.cat[k]={p:0,d:0});a.p+=r.cat[k].p;a.d+=r.cat[k].d}
    for(const k in r.subj){const s=r.subj[k],a=A.subj[k]||(A.subj[k]={cat:s.cat,p:0,d:0,pc:0,dc:0});a.p+=s.p;a.d+=s.d;a.pc+=s.pc;a.dc+=s.dc}
    r.day.forEach((d,i)=>{A.day[i].p+=d.p;A.day[i].d+=d.d});
    habitsFor(n).forEach(h=>{const a=A.hab[h.id]||(A.hab[h.id]={p:0,d:0});a.p+=7;a.d+=r.hab[h.id]||0});}
  A.pct=A.pMin?Math.round(A.dMin/A.pMin*100):0;A.hPct=A.hP?Math.round(A.hD/A.hP*100):0;
  return A;
}

    waves:[40,16,`<path d='M0 8q10-8 20 0t20 0' fill='none' stroke='${c}' stroke-width='1.3'/>`],
    tri:[24,21,`<path d='M12 3l9 15H3z' fill='none' stroke='${c}' stroke-width='1.2'/>`],

function themeOf(n){
  const w=state.weeks[n];const pick=(w&&w.theme)||state.fixedTheme;
  return THEMES.find(t=>t.id===pick)||THEMES[(n-1)%THEMES.length];

}

function fitSlots(root){
  (root||document).querySelectorAll('.slot b, .slot em').forEach(el=>{
    el.style.fontSize='';el.style.whiteSpace='';
    const base=parseFloat(getComputedStyle(el).fontSize),min=el.tagName==='B'?10.5:9.5;let fs=base;
    if(el.clientWidth===0)return;
    while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=.5;el.style.fontSize=fs+'px'}
    if(el.scrollWidth>el.clientWidth+1)el.style.whiteSpace='normal';
  });
}
function fitQuote(){
  const el=document.querySelector('.quote blockquote:not([contenteditable])');if(!el)return;
  el.style.whiteSpace='nowrap';let fs=28;el.style.fontSize=fs+'px';
  while(el.scrollWidth>el.clientWidth&&fs>16){fs--;el.style.fontSize=fs+'px'}
  el.style.whiteSpace='';
}

  }

}

function lineChart(labels,series){
  const W=760,H=230,pl=40,pr=14,pt=14,pb=30,n=labels.length,iw=W-pl-pr,ih=H-pt-pb;
  const x=i=>pl+(n<=1?iw/2:i*iw/(n-1)),y=v=>pt+ih-v/100*ih;
  let g='';for(let v=0;v<=100;v+=25)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-7}" y="${y(v)+4}" class="ax" text-anchor="end">${v}%</text>`;
  const step=Math.ceil(n/14);labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${H-9}" class="ax" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{g+=`<polyline points="${s.values.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" style="fill:${s.color}"><title>أسبوع ${labels[i]}: ${v}%</title></circle>`)});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" dir="ltr" role="img" aria-label="منحنى الإنجاز الأسبوعي">${g}</svg>`;
}
function hbar(label,p,d,color,right){const pp=p?Math.round(d/p*100):0;

function viewDash(){

  ui.from=Math.min(Math.max(ui.from,1),N);ui.to=Math.min(Math.max(ui.to,ui.from),N);

  let h=`<div class="rangebar no-print"><span class="lbl">الفترة من</span><select id="rFrom">${opt(ui.from)}</select><span class="lbl">إلى</span><select id="rTo">${opt(ui.to)}</select>

function dashBody(A,cur,interactive){

  const good=A.weeks.filter(w=>w.pct>=80).length;
  let h=`<div class="kpis">
    <div class="kpi lead"><b>${A.pct}%</b><span>نسبة إنجاز الجدول</span></div>
    <div class="kpi"><b>${hrs(A.dMin)}</b><span>ساعة اتذاكرت من ${hrs(A.pMin)} مخططة</span></div>
    <div class="kpi"><b>${A.dCnt}</b><span>جلسة خلصت من ${A.pCnt}</span></div>
    <div class="kpi"><b>${A.hPct}%</b><span>الالتزام بالعادات</span></div>

    h+=`<button ${interactive?`data-goweek="${n}"`:''} style="--a:${themeOf(n).a}" class="${fut?'fut':'l'+l} ${n>=ui.from&&n<=ui.to?'inr':''} ${n===cur?'cur':''}" title="أسبوع ${n} (${rangeLabel(n)}): ${r.pct}%">${n}</button>`}
  h+=`</div><p class="hint" style="margin:10px 0 0">كل مربع أسبوع بلونه، وكل ما يغمق كل ما الإنجاز يزيد. المربعات المحاطة بإطار هي الفترة اللي التقرير بيحسبها.${interactive?' اضغط على أي أسبوع تفتحه.':''}</p></div>`;
  // trend
  h+=`<div class="sec"><h2>الإنجاز أسبوع بأسبوع</h2></div><div class="card"><div class="keys"><span><i style="background:var(--acc)"></i>الجدول</span><span><i style="background:#C9962B"></i>العادات</span></div>
    ${lineChart(A.weeks.map(w=>w.n),[{color:'var(--acc-t)',values:A.weeks.map(w=>w.pct)},{color:'#C9962B',values:A.weeks.map(w=>w.hPct)}])}</div>`;
  // cats & days
  h+=`<div class="grid2" style="margin-top:14px"><div class="card"><h3>الساعات حسب القسم</h3>`;
  const cats=Object.keys(A.cat);if(!cats.length)h+='<p class="hint">لسه مفيش بيانات.</p>';
  cats.forEach(k=>{const c=catOf(k),v=A.cat[k];h+=hbar(esc(c.name),v.p,v.d,c.color,`${hrs(v.d)} / ${hrs(v.p)} س`)});
  h+=`<p class="hint" style="margin:6px 0 0">الجزء الفاتح هو المخطط، والغامق هو اللي اتعمل.</p></div><div class="card"><h3>أقوى وأضعف أيام الأسبوع</h3>`;
  A.day.forEach((d,i)=>h+=hbar(DAYS[i],d.p,d.d,'var(--acc-t)'));
  h+=`</div></div>`;
  // subjects
  const subs=Object.entries(A.subj).sort((a,b)=>b[1].p-a[1].p);
  h+=`<div class="sec"><h2>تفاصيل كل مادة</h2></div><div class="card" style="overflow-x:auto"><table class="dt"><thead><tr><th>المادة</th><th>القسم</th><th>جلسات خلصت</th><th>ساعات خلصت</th><th>ساعات مخططة</th><th>النسبة</th></tr></thead><tbody>`;
  subs.forEach(([k,v])=>{const p=v.p?Math.round(v.d/v.p*100):0,c=catOf(v.cat);
    h+=`<tr><td><b style="font-weight:600">${esc(k)}</b></td><td><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</td><td>${v.dc} / ${v.pc}</td><td>${hrs(v.d)}</td><td>${hrs(v.p)}</td><td><span class="pill ${pctClass(p)}">${p}%</span></td></tr>`});
  h+=`</tbody></table></div>`;
  // habits
  h+=`<div class="sec"><h2>العادات</h2></div><div class="card">`;
  const hk=Object.keys(A.hab);if(!hk.length)h+='<p class="hint">مفيش عادات في الفترة دي.</p>';
  hk.forEach(id=>{const x=state.habits.find(z=>z.id===id);if(!x)return;const v=A.hab[id];h+=hbar(esc(x.name),v.p,v.d,'#C9962B',`${v.d} / ${v.p} يوم`)});
  h+=`</div>`;
  // compare
  if(interactive){
    let o=(v)=>{let s='';for(let i=1;i<=N;i++)s+=`<option value="${i}" ${i===v?'selected':''}>أسبوع ${i}</option>`;return s};
    h+=`<div class="sec"><h2>قارن بين أسبوعين</h2></div><div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px" class="no-print"><select id="cmpA">${o(ui.cmpA)}</select><span>مع</span><select id="cmpB">${o(ui.cmpB)}</select></div>${compareTable(ui.cmpA,ui.cmpB)}</div>`;
  }
  return h;
}
function allTimeLog(){
  const cur=state.template,inPlan=new Set();
  Object.values(cur.cells).forEach(r=>(r||[]).forEach(c=>{if(c&&c.t)inPlan.add(c.t.trim())}));
  const L={};
  for(let n=1;n<=state.weeksCount;n++){const r=weekStats(n);for(const k in r.subj){const s=r.subj[k];if(!s.dc)continue;
    const a=L[k]||(L[k]={cat:s.cat,d:0,dc:0,first:n,last:n});a.d+=s.d;a.dc+=s.dc;a.last=n}}
  const rows=Object.entries(L).sort((a,b)=>b[1].d-a[1].d);
  let h=`<div class="sec"><h2>سجل كل اللي اشتغلت عليه</h2><span>سجل دائم للسنة كلها، مش بيتمسح لو شلت مادة من الجدول</span></div><div class="card" style="overflow-x:auto">`;
  if(!rows.length)return h+`<div class="empty"><b>السجل لسه فاضي</b>أول ما تعلّم أي جلسة إنها خلصت هتظهر هنا.</div></div>`;
  h+=`<table class="dt"><thead><tr><th>المادة</th><th>القسم</th><th>جلسات خلصت</th><th>إجمالي الساعات</th><th>من أسبوع</th><th>آخر أسبوع</th><th>الحالة</th></tr></thead><tbody>`;
  rows.forEach(([k,v])=>{const c=catOf(v.cat),on=inPlan.has(k);
    h+=`<tr><td><b style="font-weight:600">${esc(k)}</b></td><td><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</td><td>${v.dc}</td><td>${hrs(v.d)}</td><td>${v.first}</td><td>${v.last}</td><td><span class="tag ${on?'on':'off'}">${on?'في الجدول الأساسي':'خلصت / اتشالت من الجدول'}</span></td></tr>`});
  return h+'</tbody></table></div>';
}
function compareTable(a,b){
  const A=weekStats(a),B=weekStats(b);
  const diff=(x,y,u='')=>{const d=Math.round((y-x)*10)/10;return d>0?`<span class="up">+${d}${u}</span>`:d<0?`<span class="down">${d}${u}</span>`:'—'};
  let h=`<div style="overflow-x:auto"><table class="dt"><thead><tr><th>المقياس</th><th>أسبوع ${a}</th><th>أسبوع ${b}</th><th>الفرق</th></tr></thead><tbody>
    <tr><td>إنجاز الجدول</td><td>${A.pct}%</td><td>${B.pct}%</td><td>${diff(A.pct,B.pct,'%')}</td></tr>
    <tr><td>ساعات اتعملت</td><td>${hrs(A.dMin)}</td><td>${hrs(B.dMin)}</td><td>${diff(A.dMin/60,B.dMin/60)}</td></tr>
    <tr><td>جلسات خلصت</td><td>${A.dCnt}/${A.pCnt}</td><td>${B.dCnt}/${B.pCnt}</td><td>${diff(A.dCnt,B.dCnt)}</td></tr>
    <tr><td>العادات</td><td>${A.hPct}%</td><td>${B.hPct}%</td><td>${diff(A.hPct,B.hPct,'%')}</td></tr>
    <tr><td>مهام خلصت</td><td>${A.tD}/${A.tP}</td><td>${B.tD}/${B.tP}</td><td>${diff(A.tD,B.tD)}</td></tr>`;
  const ks=new Set([...Object.keys(A.cat),...Object.keys(B.cat)]);
  ks.forEach(k=>{const x=A.cat[k]||{d:0},y=B.cat[k]||{d:0};h+=`<tr><td>ساعات ${esc(catOf(k).name)}</td><td>${hrs(x.d)}</td><td>${hrs(y.d)}</td><td>${diff(x.d/60,y.d/60)}</td></tr>`});
  return h+'</tbody></table></div>';
}
function insights(A){
  const out=[];
  if(!A.pMin)return['مفيش خطة في الفترة دي.'];
  out.push(`خلّصت <b>${A.pct}%</b> من الجدول في الفترة دي: ${hrs(A.dMin)} ساعة من ${hrs(A.pMin)} ساعة مخططة، و${A.hPct}% التزام بالعادات.`);
  if(A.tP)out.push(`خلّصت ${A.tD} من ${A.tP} مهمة (${Math.round(A.tD/A.tP*100)}%).`);
  const ws=A.weeks.filter(w=>w.pMin&&w.n<=currentWeek());
  if(ws.length>1){const b=[...ws].sort((x,y)=>y.pct-x.pct);out.push(`أحسن أسبوع كان أسبوع ${b[0].n} بنسبة ${b[0].pct}%، وأضعف أسبوع كان أسبوع ${b[b.length-1].n} بنسبة ${b[b.length-1].pct}%.`)}
  const subs=Object.entries(A.subj).filter(([k,v])=>v.pc>=2).map(([k,v])=>[k,Math.round(v.d/v.p*100)]).sort((a,b)=>b[1]-a[1]);
  if(subs.length>1)out.push(`أكتر مادة ملتزم بيها: <b>${esc(subs[0][0])}</b> (${subs[0][1]}%). أكتر مادة محتاجة اهتمام: <b>${esc(subs[subs.length-1][0])}</b> (${subs[subs.length-1][1]}%).`);
  const dd=A.day.map((d,i)=>[i,d.p?Math.round(d.d/d.p*100):0]).sort((a,b)=>b[1]-a[1]);
  if(A.dMin)out.push(`أقوى يوم عندك ${DAYS[dd[0][0]]} (${dd[0][1]}%)، وأضعف يوم ${DAYS[dd[6][0]]} (${dd[6][1]}%).`);
  const hb=Object.entries(A.hab).map(([id,v])=>[state.habits.find(z=>z.id===id),v.p?Math.round(v.d/v.p*100):0]).filter(x=>x[0]).sort((a,b)=>b[1]-a[1]);
  if(hb.length>1)out.push(`أكتر عادة ملتزم بيها: ${esc(hb[0][0].name)} (${hb[0][1]}%)، وأقلها: ${esc(hb[hb.length-1][0].name)} (${hb[hb.length-1][1]}%).`);
  if(ws.length>=8){const l=ws.slice(-4),p=ws.slice(-8,-4),av=a=>Math.round(a.reduce((s,w)=>s+w.pct,0)/a.length),x=av(l),y=av(p);
    out.push(x>=y?`متوسط آخر 4 أسابيع ${x}% مقابل ${y}% في الـ4 اللي قبلهم، يعني في تحسن.`:`متوسط آخر 4 أسابيع ${x}% مقابل ${y}% في الـ4 اللي قبلهم، يعني في تراجع محتاج تقف عنده.`)}
  return out;
}

  <div class="sec"><h2>الوصايا</h2><span>بتظهر في واجهة كل أسبوع، وصية مختلفة كل أسبوع</span></div><div class="card">
    <div class="form" style="margin-bottom:14px"><label>عنوان الوصايا<input type="text" data-set="quotesTitle" value="${esc(state.quotesTitle||'')}"></label></div>
    ${(state.quotes||[]).map((q,i)=>`<div class="qrow"><textarea data-quote="${i}" aria-label="وصية ${i+1}">${esc(q)}</textarea><button class="xbtn" data-delquote="${i}" aria-label="حذف الوصية">✕</button></div>`).join('')}
    <button class="btn" data-act="addquote">${ICON.plus} إضافة وصية</button></div>
  <div class="sec"><h2>شكل الأسابيع</h2><span>كل أسبوع بياخد شكل وألوان مختلفة تلقائياً</span></div><div class="card">
    <div class="form" style="margin-bottom:16px"><label>طريقة التلوين<select data-set="fixedTheme"><option value="">شكل مختلف لكل أسبوع (تلقائي)</option>${THEMES.map(t=>`<option value="${t.id}" ${state.fixedTheme===t.id?'selected':''}>نفس الشكل لكل الأسابيع: ${t.name}</option>`).join('')}</select></label></div>
    <div class="themegrid">${THEMES.map(t=>`<div class="tcard" style="--a:${t.a};--b:${t.b};--tp:${patternURI(t.pat,'#ffffff').replace(/"/g,'&quot;')}"><div class="tp"></div><div>${t.name}</div></div>`).join('')}</div>
    <p class="hint" style="margin-top:12px">تقدر تختار شكل معيّن لأي أسبوع من وضع التعديل في صفحة الجدول.</p></div>
  <div class="sec"><h2>الأقسام والألوان</h2></div><div class="card">
    ${state.cats.map(c=>`<div class="catrow"><input type="color" data-cat="${c.id}" data-f="color" value="${c.color}" aria-label="لون ${esc(c.name)}"><input type="text" data-cat="${c.id}" data-f="name" value="${esc(c.name)}"><button class="btn sm danger" data-act="delcat" data-id="${c.id}">حذف</button></div>`).join('')}
    <button class="btn" data-act="addcat">+ إضافة قسم</button></div>
  <div class="sec"><h2>البيانات</h2></div><div class="card">
    <p class="hint" style="margin-top:0">كل البيانات محفوظة في المتصفح ده بس. اعمل نسخة احتياطية كل فترة، وتقدر ترجعها على أي جهاز تاني.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" data-act="export">تنزيل نسخة احتياطية</button>
      <label class="btn" style="cursor:pointer">استرجاع نسخة<input type="file" id="importFile" accept=".json,application/json" hidden></label>
      <button class="btn danger" data-act="resetall">مسح كل البيانات والبدء من جديد</button>
    </div></div>`;
}


/* ============ modal ============ */
const dlg=document.getElementById('dlg');
function modal(title,body,actions){
  document.getElementById('dlgT').textContent=title;document.getElementById('dlgB').innerHTML=body;
  const a=document.getElementById('dlgA');a.innerHTML='';
  actions.forEach(x=>{const b=document.createElement('button');b.className='btn '+(x.cls||'');b.textContent=x.label;b.type='button';
    b.onclick=()=>{if(x.fn&&x.fn()===false)return;dlg.close()};a.appendChild(b)});
  dlg.showModal();const f=dlg.querySelector('input,select');if(f)f.focus();
}
function openCell(slotId,day){
  const plan=getPlan(ui.week),c=(plan.cells[slotId]||[])[day]||{t:'',s:'',c:(state.cats[0]||{}).id,star:false};
  const scopeTxt=ui.scope==='week'?'التعديل هيتطبق على الأسبوع ده بس.':'التعديل هيتطبق على الجدول الأساسي من الأسبوع ده ورايح.';
  modal(`${DAYS[day]} — تعديل الخانة`,`<div class="form">
    <label>المادة / النشاط<input type="text" id="fT" value="${esc(c.t)}"></label>
    <label>التفاصيل<input type="text" id="fS" value="${esc(c.s||'')}"></label>
    <label>القسم<select id="fC">${state.cats.map(x=>`<option value="${x.id}" ${x.id===c.c?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
    <label class="ck"><input type="checkbox" id="fStar" ${c.star?'checked':''}>أولوية ★</label>
    <label class="ck"><input type="checkbox" id="fRow">طبّق على كل أيام الفترة دي</label>
    <p class="hint" style="margin:0">${scopeTxt}</p></div>`,
  [{label:'إلغاء'},
   {label:'مسح الخانة',cls:'danger',fn:()=>{const p=editablePlan(),row=document.getElementById('fRow').checked;p.cells[slotId]=p.cells[slotId]||Array(7).fill(null);
      if(row)p.cells[slotId]=Array(7).fill(null);else p.cells[slotId][day]=null;save();render()}},
   {label:'حفظ',cls:'primary',fn:()=>{const v={t:document.getElementById('fT').value.trim(),s:document.getElementById('fS').value.trim(),c:document.getElementById('fC').value,star:document.getElementById('fStar').checked};
      if(!v.t){toast('اكتب اسم المادة الأول');return false}
      const p=editablePlan(),row=document.getElementById('fRow').checked;p.cells[slotId]=p.cells[slotId]||Array(7).fill(null);
      if(row)p.cells[slotId]=Array.from({length:7},()=>({...v}));else p.cells[slotId][day]=v;save();render();toast('اتحفظ')}}]);
}
function openSlot(id){
  const s=getPlan(ui.week).slots.find(x=>x.id===id);if(!s)return;
  modal('تعديل وقت الفترة',`<div class="form"><label>من<input type="time" id="fA" value="${s.start}"></label><label>إلى<input type="time" id="fB" value="${s.end}"></label></div>`,
  [{label:'إلغاء'},
   {label:'حذف الفترة',cls:'danger',fn:()=>{if(!confirm('تحذف الفترة دي بكل خاناتها؟'))return false;const p=editablePlan();p.slots=p.slots.filter(x=>x.id!==id);delete p.cells[id];save();render()}},
   {label:'حفظ',cls:'primary',fn:()=>{const a=document.getElementById('fA').value,b=document.getElementById('fB').value;if(!a||!b)return false;
      const p=editablePlan(),x=p.slots.find(z=>z.id===id);x.start=a;x.end=b;save();render()}}]);
}


/* ============ events ============ */
document.addEventListener('click',e=>{
  const vw=e.target.closest('[data-view]');if(vw){ui.view=vw.dataset.view;render();return}
  const dy=e.target.closest('[data-day]');if(dy){ui.day=+dy.dataset.day;render();return}
  const tpk=e.target.closest('[data-theme-pick]');if(tpk){const w=getWeek(ui.week,true),v=tpk.dataset.themePick;if(v)w.theme=v;else delete w.theme;save();render();toast(v?'شكل الأسبوع اتغير':'رجع للشكل التلقائي');return}
  const tab=e.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;ui.edit=false;render();return}
  const gw=e.target.closest('[data-goweek]');if(gw){ui.week=+gw.dataset.goweek;ui.tab='schedule';render();window.scrollTo(0,0);return}
  const rg=e.target.closest('[data-range]');if(rg){const c=currentWeek(),k=rg.dataset.range;
    if(k==='todate'){ui.from=1;ui.to=c}if(k==='last4'){ui.to=c;ui.from=Math.max(1,c-3)}if(k==='q'){ui.to=c;ui.from=Math.max(1,c-12)}if(k==='year'){ui.from=1;ui.to=state.weeksCount}render();return}
  const cell=e.target.closest('[data-cell]');
  if(cell&&cell.closest('#main')){const [sid,d]=cell.dataset.cell.split('|');
    if(ui.edit){openCell(sid,+d);return}
    if(cell.classList.contains('slot')){const w=getWeek(ui.week,true),k=sid+'_'+d;if(w.done[k])delete w.done[k];else w.done[k]=true;save();render()}return}
  const ds=e.target.closest('[data-delslot]');if(ds){const id=ds.dataset.delslot,k=doneInSlot(ui.week,id);
    if(!confirm(`تحذف الفترة دي من ${ui.scope==='week'?'الأسبوع ده':'الجدول الأساسي من الأسبوع ده ورايح'}؟\n\nسجل الأسابيع اللي فاتت محفوظ ومش هيتأثر.${k?`\nتنبيه: في ${k} جلسة متعلّمة في الفترة دي الأسبوع ده، هتتشال من حساب الأسبوع ده بس.`:''}`))return;const p=editablePlan();p.slots=p.slots.filter(x=>x.id!==id);delete p.cells[id];save();render();return}
  const dq=e.target.closest('[data-delquote]');if(dq){if(!confirm('تحذف الوصية دي؟'))return;state.quotes.splice(+dq.dataset.delquote,1);save();render();return}
  const dt=e.target.closest('[data-deltodo]');if(dt){const w=getWeek(ui.week,true);w.todos=(w.todos||[]).filter(t=>t.id!==dt.dataset.deltodo);save();render();return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  switch(act){
    case 'qprev':ui.qOff--;render();return;
    case 'qnext':ui.qOff++;render();return;
    case 'prev':ui.qOff=0;ui.week=Math.max(1,ui.week-1);ui.day=isThisWeek(ui.week)?todayIdx():0;break;
    case 'next':ui.qOff=0;ui.week=Math.min(state.weeksCount,ui.week+1);ui.day=isThisWeek(ui.week)?todayIdx():0;break;
    case 'today':ui.week=currentWeek();ui.day=isThisWeek(ui.week)?todayIdx():0;break;
    case 'edit':ui.edit=!ui.edit;break;
    case 'addrow':{const p=editablePlan(),last=[...p.slots].sort((a,b)=>toMin(b.end)-toMin(a.end))[0];const st=last?last.end:'18:00',m=(toMin(st)+60)%1440;
      const id=uid();p.slots.push({id,start:st,end:`${pad(Math.floor(m/60))}:${pad(m%60)}`});p.cells[id]=Array(7).fill(null);toast('اتضافت فترة جديدة، عدّل وقتها وخاناتها');break}
    case 'copyprev':{if(!confirm(`تستبدل خطة أسبوع ${ui.week} بخطة أسبوع ${ui.week-1}؟`))return;getWeek(ui.week,true).plan=clone(getPlan(ui.week-1));toast('اتنسخت');break}
    case 'revert':{if(!confirm('ترجّع الأسبوع ده للجدول الأساسي؟ التعديلات الخاصة بيه هتتمسح.'))return;getWeek(ui.week,true).plan=null;toast('رجع للجدول الأساسي');break}
    case 'promote':{if(!confirm('تخلي خطة الأسبوع ده هي الجدول الأساسي من الأسبوع ده ورايح؟'))return;freezePast(ui.week);state.template=clone(getPlan(ui.week));getWeek(ui.week,true).plan=null;toast('اتعمدت كجدول أساسي');break}
    case 'addhabit':{const n=document.getElementById('nhName').value.trim();if(!n){toast('اكتب اسم العادة');return}
      state.habits.push({id:uid(),name:n,desc:document.getElementById('nhDesc').value.trim(),from:ui.week});toast('العادة اتضافت');break}
    case 'edithabit':{const x=state.habits.find(z=>z.id===b.dataset.id);
      modal('تعديل العادة',`<div class="form"><label>الاسم<input type="text" id="hN" value="${esc(x.name)}"></label><label>الوصف<input type="text" id="hD" value="${esc(x.desc||'')}"></label></div>`,
        [{label:'إلغاء'},{label:'حفظ',cls:'primary',fn:()=>{const v=document.getElementById('hN').value.trim();if(!v)return false;x.name=v;x.desc=document.getElementById('hD').value.trim();save();render()}}]);return}
    case 'delhabit':{const x=state.habits.find(z=>z.id===b.dataset.id);if(!confirm(`توقف "${x.name}" من أسبوع ${ui.week} ورايح؟ المتابعة القديمة هتفضل في الداشبورد.`))return;
      if((x.from||1)>=ui.week)state.habits=state.habits.filter(z=>z.id!==x.id);else x.to=ui.week-1;toast('العادة اتوقفت');break}
    case 'addtodo':{const t=document.getElementById('tdText').value.trim();if(!t){toast('اكتب المهمة الأول');return}
      const dv=document.getElementById('tdDay').value,w=getWeek(ui.week,true);(w.todos=w.todos||[]).push({id:uid(),t,day:dv===''?null:+dv,done:false});save();render();document.getElementById('tdText').focus();return}
    case 'carrytodo':{const w=getWeek(ui.week,true),nx=getWeek(ui.week+1,true),left=(w.todos||[]).filter(t=>!t.done);
      nx.todos=(nx.todos||[]).concat(left.map(t=>({...t,id:uid()})));w.todos=w.todos.filter(t=>t.done);toast(`اتنقلت ${left.length} مهام لأسبوع ${ui.week+1}`);break}
    case 'addquote':{(state.quotes=state.quotes||[]).push('اكتب الوصية الجديدة هنا');ui.qOff=(state.quotes.length-1)-(ui.week-1);save();render();
      const bq=document.querySelector('[data-qidx]');if(bq){bq.focus();const r=document.createRange();r.selectNodeContents(bq);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}else if(ui.tab==='settings'){toast('اتضافت وصية جديدة')}return}
    case 'addcat':state.cats.push({id:uid(),name:'قسم جديد',color:'#B88A2C'});break;
    case 'delcat':{if(!confirm('تحذف القسم ده؟ الخانات اللي عليه هتبقى "بدون تصنيف".'))return;state.cats=state.cats.filter(c=>c.id!==b.dataset.id);break}
    case 'export':{const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`weekly-planner-backup-${iso(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();return}
    case 'resetall':{if(!confirm('هتمسح كل الجداول والمتابعة والعادات. متأكد؟'))return;state=defaults();ui.week=currentWeek();toast('اتمسح كل حاجة');break}
    case 'print-week':askOwner(()=>doPrint('week'));return;
    case 'print-report':askOwner(()=>doPrint('report'));return;
  }
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='weekSel'){ui.week=+t.value;ui.day=isThisWeek(ui.week)?todayIdx():0;render();return}
  if(t.dataset.tslot){const p=editablePlan(),x=p.slots.find(z=>z.id===t.dataset.tslot);if(x&&t.value){x[t.dataset.tf]=t.value;save();render();toast('الوقت اتعدل')}return}
  if(t.dataset.todo){const w=getWeek(ui.week,true),x=(w.todos||[]).find(z=>z.id===t.dataset.todo);if(x){x.done=t.checked;save();render()}return}
  if(t.name==='scope'){ui.scope=t.value;return}
  if(t.dataset.habit){const w=getWeek(ui.week,true);if(t.checked)w.habits[t.dataset.habit]=true;else delete w.habits[t.dataset.habit];save();render();return}
  if(t.dataset.quote!=null){const v=t.value.trim();if(v){state.quotes[+t.dataset.quote]=v;save();toast('الوصية اتحفظت')}return}
  if(t.id==='weekNote'){getWeek(ui.week,true).note=t.value;save();toast('الملاحظات اتحفظت');return}
  if(t.id==='rFrom'){ui.from=+t.value;if(ui.to<ui.from)ui.to=ui.from;render();return}
  if(t.id==='rTo'){ui.to=+t.value;if(ui.from>ui.to)ui.from=ui.to;render();return}
  if(t.id==='cmpA'){ui.cmpA=+t.value;render();return}
  if(t.id==='cmpB'){ui.cmpB=+t.value;render();return}
  if(t.dataset.set){const k=t.dataset.set;let v=t.value;if(k==='weeksCount'){v=Math.min(Math.max(parseInt(v)||52,1),60);ui.week=Math.min(ui.week,v)}if(k==='start'&&!v)return;state[k]=v;save();render();toast('اتحفظ');return}
  if(t.dataset.cat){const c=state.cats.find(x=>x.id===t.dataset.cat);c[t.dataset.f]=t.value;save();render();return}
  if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.template||!d.weeks)throw 0;
      if(!confirm('النسخة دي هتستبدل كل البيانات الحالية. تكمل؟'))return;state={...defaults(),...d};save();ui.week=currentWeek();render();toast('النسخة اترجعت')}catch(err){toast('الملف ده مش نسخة احتياطية من الجدول')}};r.readAsText(t.files[0])}
});

document.addEventListener('keydown',e=>{
  if(e.target.id==='tdText'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-act="addtodo"]').click()}
  if(e.target.dataset&&e.target.dataset.qidx!=null&&e.key==='Enter'){e.preventDefault();e.target.blur()}
  if((e.target.id==='hTitle'||e.target.id==='hSub')&&e.key==='Enter'){e.preventDefault();e.target.blur()}
});
document.addEventListener('focusout',e=>{
  if(e.target.dataset&&e.target.dataset.qidx!=null){const i=+e.target.dataset.qidx,v=e.target.textContent.replace(/\s+/g,' ').trim();
    if(!v){e.target.textContent=state.quotes[i];return}if(state.quotes[i]!==v){state.quotes[i]=v;save();toast('الوصية اتحفظت')}return}
  const id=e.target.id;if(id!=='hTitle'&&id!=='hSub')return;
  const v=e.target.textContent.trim(),k=id==='hTitle'?'title':'subtitle';
  if(k==='title'&&!v){e.target.textContent=state.title;return}
  if(state[k]!==v){state[k]=v;save();toast('اتحفظ')}
});


/* ============ print ============ */
function askOwner(go){
  if(state.owner){go();return}
  modal('مين اللي هيتكتب اسمه في التقرير؟',`<div class="form"><label>الاسم<input type="text" id="ownN" placeholder="اكتب الاسم"></label>
    <label class="ck"><input type="checkbox" id="ownS">احفظ الاسم ده للتقارير الجاية</label>
    <p class="hint">لو سبته فاضي، التقرير هيتطبع من غير اسم.</p></div>`,
  [{label:'إلغاء'},{label:'اطبع',cls:'primary',fn:()=>{const v=document.getElementById('ownN').value.trim();
    if(v&&document.getElementById('ownS').checked){state.owner=v;save()}ui.printOwner=v;setTimeout(go,50)}}]);
}
function doPrint(kind){
  const P=document.getElementById('printArea'),root=document.documentElement,prev=root.getAttribute('data-theme');
  root.setAttribute('data-theme','light');
  const who=state.owner||ui.printOwner||'';ui.printOwner='';
  const foot=`<div class="pr-foot"><span>${who?'Prepared by: '+esc(who):''}</span><span>تاريخ الطباعة: ${fmtD(new Date())} ${new Date().getFullYear()}</span></div>`;
  if(kind==='week'){
    const w=state.weeks[ui.week]||{};
    applyWeekTheme(ui.week);
    P.innerHTML=`<div class="pr-head"><div><h1>${esc(state.title)}</h1><div class="s">${esc(state.subtitle)}</div></div><div style="text-align:end"><b style="font-size:1.2rem">أسبوع ${ui.week}</b><div class="s">${rangeLabel(ui.week)}</div></div></div>
      ${quoteCard(ui.week,false)}<div style="height:10px"></div>${legend()}<div class="board"><div class="scroller">${scheduleTable(ui.week,false)}</div></div>
      ${(w.todos||[]).length?`<h2 class="pr-h2">حاجات لازم أعملها</h2><div class="card">${todosHtml(ui.week,false)}</div>`:''}
      <h2 class="pr-h2">العادات</h2><div class="board">${habitsTable(ui.week,false)}</div>
      ${w.note?`<h2 class="pr-h2">ملاحظات الأسبوع</h2><div class="card">${esc(w.note).replace(/\n/g,'<br>')}</div>`:''}${foot}`;
  }else{
    const A=aggregate(ui.from,ui.to);
    P.innerHTML=`<div class="pr-head"><div><h1>تقرير المتابعة</h1><div class="s">${esc(state.title)}</div></div><div style="text-align:end"><b>من أسبوع ${ui.from} إلى أسبوع ${ui.to}</b><div class="s">${fmtD(weekStart(ui.from))} – ${rangeLabel(ui.to).split('– ')[1]}</div></div></div>
      ${dashBody(A,currentWeek(),false)}${allTimeLog()}<h2 class="pr-h2">مقارنة أسبوع ${ui.cmpA} مع أسبوع ${ui.cmpB}</h2><div class="card">${compareTable(ui.cmpA,ui.cmpB)}</div>${foot}`;
  }
  document.body.classList.add('printing');fitSlots(P);
  const done=()=>{document.body.classList.remove('printing');P.innerHTML='';if(prev)root.setAttribute('data-theme',prev);else root.removeAttribute('data-theme');render();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),60);
}

render();
</script>
</body>
</html>
