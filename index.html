<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#1C2E6B; --acc2:#E8C468; --acc-t:var(--acc);
  --paper:color-mix(in srgb,var(--acc) 15%,#FFFFFF); --sheet:color-mix(in srgb,var(--acc) 4%,#FFFFFF);
  --ink:#000000; --ink-soft:#1C1C1C; --muted:#454545;
  --line:color-mix(in srgb,var(--acc) 26%,#FFFFFF); --line-2:color-mix(in srgb,var(--acc) 14%,#FFFFFF); --empty:color-mix(in srgb,var(--acc) 12%,#FFFFFF);
  --good:#126B44; --mid:#8F6110; --bad:#A42F2F;
  --slot-mix:22%; --slot-done:46%;
  --shadow:0 1px 2px rgba(22,28,52,.05),0 4px 16px rgba(22,28,52,.04);
  --r:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:color-mix(in srgb,var(--acc) 26%,#06070B); --sheet:color-mix(in srgb,var(--acc) 16%,#101219); --ink:#FFFFFF; --ink-soft:#E6E8F0;
  --line:color-mix(in srgb,var(--acc) 40%,#2A2D3A); --line-2:color-mix(in srgb,var(--acc) 28%,#1C1F2B); --muted:#C9CCD8;
  --good:#5CCB98; --mid:#E5B65A; --bad:#F08A84; --empty:color-mix(in srgb,var(--acc) 24%,#171A24); --acc-t:color-mix(in srgb,var(--acc) 35%,#fff);
  --slot-mix:34%; --slot-done:60%;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --paper:color-mix(in srgb,var(--acc) 26%,#06070B); --sheet:color-mix(in srgb,var(--acc) 16%,#101219); --ink:#FFFFFF; --ink-soft:#E6E8F0;
  --line:color-mix(in srgb,var(--acc) 40%,#2A2D3A); --line-2:color-mix(in srgb,var(--acc) 28%,#1C1F2B); --muted:#C9CCD8;
  --good:#5CCB98; --mid:#E5B65A; --bad:#F08A84; --empty:color-mix(in srgb,var(--acc) 24%,#171A24); --acc-t:color-mix(in srgb,var(--acc) 35%,#fff);
  --slot-mix:34%; --slot-done:60%;
  --shadow:none;
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif;line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.display{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--acc);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;inset:0;background:var(--pat);opacity:.35}
.brand-mark span{position:relative;z-index:1;width:14px;height:14px;border-radius:4px;background:var(--acc2)}
#hTitle{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-weight:700;font-size:1.15rem;margin:0;line-height:1.3}
#hSub{margin:0;color:var(--muted);font-size:.8rem;line-height:1.4}
.edit-head #hTitle,.edit-head #hSub{outline:1.5px dashed var(--acc2);outline-offset:3px;border-radius:5px;cursor:text}
.edit-head #hTitle:focus,.edit-head #hSub:focus{outline-style:solid}
.tabs{display:flex;gap:2px;background:var(--empty);padding:4px;border-radius:12px}
.tabs button{background:none;border:none;padding:7px 14px;border-radius:9px;font-weight:500;font-size:.88rem;color:var(--ink-soft);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(22,28,52,.12)}

.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 72px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--acc);color:#fff;padding:26px 28px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px 30px;align-items:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.16;z-index:-1;-webkit-mask-image:linear-gradient(to left,#000 10%,transparent 85%);mask-image:linear-gradient(to left,#000 10%,transparent 85%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(0,0,0,.22));z-index:-1}
.deco{position:absolute;z-index:-1;pointer-events:none}
.deco.circle{width:300px;height:300px;border-radius:50%;border:46px solid var(--acc2);opacity:.2;left:-90px;bottom:-150px}
.deco.square{width:190px;height:190px;border:30px solid var(--acc2);opacity:.18;left:-30px;top:-70px;transform:rotate(28deg);border-radius:18px}
.deco.arc{width:340px;height:340px;border-radius:50%;border:2px solid var(--acc2);opacity:.45;left:-140px;top:-160px;box-shadow:0 0 0 26px color-mix(in srgb,var(--acc2) 14%,transparent),0 0 0 60px color-mix(in srgb,var(--acc2) 8%,transparent)}
.wk{display:flex;align-items:center;gap:16px}
.wk-num{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-weight:700;font-size:4.2rem;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wk-num small{display:block;font-family:"Readex Pro",sans-serif;font-size:.78rem;font-weight:400;letter-spacing:0;opacity:.75;margin-top:8px}
.wk-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-range{font-size:1.25rem;font-weight:600}
.wk-theme{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;opacity:.85}
.wk-theme i{width:10px;height:10px;border-radius:3px;background:var(--acc2)}
.wk-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.hbtn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;padding:0}
.hbtn:hover:not(:disabled){background:rgba(255,255,255,.2)}
.hbtn:disabled{opacity:.35;cursor:default}
.hsel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:7px 12px;width:auto;min-width:240px;max-width:100%;font-size:.86rem;field-sizing:content}
.hsel option{color:#161C34;background:#fff}
.hpill{border:1px solid rgba(255,255,255,.35);background:var(--acc2);color:var(--acc);border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:600}
.rings{display:flex;gap:18px}
.ring{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px}
.ring svg{width:76px;height:76px}
.ring .bg{fill:none;stroke:rgba(255,255,255,.18);stroke-width:7}
.ring .fg{fill:none;stroke:var(--acc2);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;top:24px;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.ring span{font-size:.76rem;opacity:.85}

/* ---------- quote ---------- */
.quote{position:relative;margin:16px 0 0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 30px 20px;box-shadow:var(--shadow);overflow:hidden;isolation:isolate}
.quote::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)))}
.quote::after{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.05;z-index:-1;filter:invert(1)}
.q-mark{position:absolute;left:22px;top:-26px;font-family:"Amiri",serif;font-size:9rem;line-height:1;color:var(--acc2);opacity:.55;z-index:-1}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.q-label{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-weight:700;font-size:.85rem;color:var(--acc-t);display:inline-flex;align-items:center;gap:8px}
.q-label::before{content:"";width:8px;height:8px;background:var(--acc2);transform:rotate(45deg);border-radius:1px}
.q-count{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.quote blockquote{margin:0;font-family:"Amiri","Noto Kufi Arabic",serif;font-weight:700;font-size:28px;line-height:1.8;color:var(--ink);width:100%;overflow:hidden}
.quote blockquote[contenteditable="true"]{outline:1.5px dashed var(--acc2);outline-offset:6px;border-radius:6px;cursor:text;white-space:normal!important;font-size:22px!important}
.quote blockquote[contenteditable="true"]:focus{outline-style:solid}
.q-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.q-edit .hint{flex-basis:100%}
.q-nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.qbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;padding:0;color:var(--ink-soft)}
.qbtn svg{width:15px;height:15px}
.qbtn:hover{border-color:var(--acc-t);color:var(--acc-t)}
.q-dots{display:flex;gap:5px}
.q-dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.q-dots i.on{width:18px;background:var(--acc)}
.qrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.qrow textarea{min-height:64px;font-family:"Amiri",serif;font-size:1.05rem}
/* ---------- log ---------- */
.tag{display:inline-block;font-size:.72rem;border-radius:10px;padding:1px 9px}
.tag.on{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.off{background:var(--empty);color:var(--ink-soft)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 14px}
.toolbar .grow{flex:1}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:9px;font-size:.86rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--sheet);border:1px solid var(--line);border-radius:11px;padding:8px 14px;font-size:.86rem;font-weight:500;transition:border-color .15s,background .15s}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover:not(:disabled){border-color:var(--acc-t)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.on{background:var(--acc2);color:var(--acc);border-color:var(--acc2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:9px}
.btn.ghost{background:none}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 11px;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--acc-t);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-soft)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.custom i{background:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 30%,transparent)}

/* ---------- edit panel ---------- */
.editpanel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.ep-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:color-mix(in srgb,var(--acc2) 16%,var(--sheet));border-bottom:1px solid var(--line);font-weight:600;font-size:.9rem}
.ep-head i{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
.ep-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.ep-row:last-child{border-bottom:none}
.ep-label{font-size:.82rem;color:var(--muted);min-width:110px}
.radio-seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.radio-seg label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.86rem}
.radio-seg label:has(input:checked){border-color:var(--acc-t);background:color-mix(in srgb,var(--acc) 8%,var(--sheet));color:var(--acc-t);font-weight:500}
.radio-seg input{accent-color:var(--acc)}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;padding:0;background:linear-gradient(135deg,var(--a) 0 62%,var(--b) 62% 100%);position:relative}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--sheet) inset}
.sw-auto{height:34px;border-radius:10px;border:1px dashed var(--line);background:none;padding:0 12px;font-size:.8rem;color:var(--ink-soft)}
.sw-auto[aria-pressed="true"]{border-style:solid;border-color:var(--ink);color:var(--ink)}
.hint{font-size:.82rem;color:var(--muted);margin:0}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.legend>span{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-soft);background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 10px}
.legend i{width:9px;height:9px;border-radius:50%}
.star{color:var(--mid);font-size:.78rem;margin-inline-start:4px}

/* ---------- week table ---------- */
.board{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.scroller{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:0;width:100%;min-width:1040px;table-layout:fixed}
.tt th,.tt td{padding:6px;vertical-align:top;border-bottom:1px solid var(--line-2)}
.tt td+td,.tt th+td,.tt th+th{border-inline-start:1px solid var(--line-2)}
.tt thead th{padding:14px 6px 12px;text-align:center;font-weight:700;font-size:.92rem;background:color-mix(in srgb,var(--acc) 13%,var(--sheet));color:var(--ink);border-bottom:1px solid var(--line)}
.tt thead th small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.tt thead th.is-today{background:var(--acc);color:#fff;border-radius:12px 12px 0 0;position:relative}
.tt thead th.is-today small{color:rgba(255,255,255,.8)}
.today-chip{display:inline-block;margin-top:5px;background:var(--acc2);color:var(--acc);font-size:.7rem;font-weight:700;border-radius:20px;padding:1px 10px}
.tt .time{width:112px;text-align:start;padding:12px 14px;background:color-mix(in srgb,var(--acc) 9%,var(--sheet))}
.tt .time b{display:block;font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums}
.tt .time .to{display:block;font-size:.78rem;color:var(--muted)}
.tt .time .du{display:inline-block;margin-top:6px;font-size:.7rem;color:var(--ink-soft);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:0 8px}
.tt td.is-today{background:color-mix(in srgb,var(--acc) 7%,var(--sheet));box-shadow:inset 2px 0 0 var(--acc),inset -2px 0 0 var(--acc)}
.tt tfoot td.is-today{box-shadow:inset 2px 0 0 var(--acc),inset -2px 0 0 var(--acc),inset 0 -2px 0 var(--acc)}
.tt td.is-today .slot{box-shadow:0 2px 8px color-mix(in srgb,var(--acc) 18%,transparent)}
.tt tfoot td,.tt tfoot th{text-align:center;padding:10px 6px;border-bottom:none;border-top:1px solid var(--line)}
.tt tfoot th.time{font-size:.8rem;color:var(--ink-soft);font-weight:500}
.minibar{height:6px;border-radius:4px;background:var(--empty);overflow:hidden;margin:0 10px 5px}
.minibar i{display:block;height:100%;background:var(--acc)}
.tt tfoot span{font-size:.76rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* slot (shape depends on week theme) */
.slot{--c:#888;position:relative;display:block;width:100%;min-height:76px;text-align:right;border:none;padding:10px 10px 10px 10px;color:var(--ink);
  background:color-mix(in srgb,var(--c) var(--slot-mix),var(--sheet));border-radius:12px;border-inline-start:5px solid var(--c);transition:background .15s,transform .1s}
.slot b{display:block;font-weight:700;font-size:14px;line-height:1.4;color:var(--ink);padding-left:22px}
.slot b,.slot em{white-space:nowrap;overflow:hidden;text-align:right}
.slot em{unicode-bidi:plaintext}
.slot em{font-style:normal;display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.slot .tick{position:absolute;top:10px;left:8px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--c);background:var(--sheet);display:grid;place-items:center;font-style:normal;font-size:.62rem;color:transparent;transition:background .15s}
.slot:hover{background:color-mix(in srgb,var(--c) calc(var(--slot-mix) + 8%),var(--sheet))}
.slot:active{transform:scale(.985)}
.slot.done{background:color-mix(in srgb,var(--c) var(--slot-done),var(--sheet))}
.slot.done .tick{background:var(--c);border-color:var(--c);color:#fff}
.slot.done b{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--ink)}
[data-shape="sharp"] .slot{border-radius:4px;border-inline-start:none;box-shadow:inset 0 3px 0 var(--c)}
[data-shape="pill"] .slot{border-radius:20px;border-inline-start:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 40%,transparent)}
[data-shape="notch"] .slot{border-radius:0;border-inline-start:none;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);box-shadow:inset -3px 0 0 var(--c)}
[data-shape="tab"] .slot{border-radius:14px 3px 14px 3px;border-inline-start:3px solid var(--c)}
.edit-on .slot{outline:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent);outline-offset:-3px}
.edit-on .slot .tick{display:none}
.addcell{width:100%;min-height:76px;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--muted);font-size:.8rem}
.addcell:hover{border-color:var(--acc-t);color:var(--acc-t)}
.tedit{display:flex;flex-direction:column;gap:5px}
.tedit label{display:flex;flex-direction:column;font-size:.7rem;color:var(--muted);gap:2px}
.tedit input{padding:4px 6px;font-size:.8rem;width:100%}
.tedit .del{background:none;border:none;color:var(--bad);font-size:.74rem;padding:2px;text-align:start}
.addrowcell{padding:10px!important;background:var(--sheet)!important}
.addrowbtn{width:100%;border:1.5px dashed color-mix(in srgb,var(--acc) 40%,var(--line));background:color-mix(in srgb,var(--acc) 4%,var(--sheet));color:var(--acc-t);border-radius:12px;padding:12px;font-weight:500}

/* ---------- day view ---------- */
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.daychip{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.daychip b{font-size:.84rem;font-weight:600}
.daychip span{font-size:.7rem;color:var(--muted)}
.daychip .dp{width:70%;height:4px;border-radius:3px;background:var(--empty);overflow:hidden;margin-top:4px}
.daychip .dp i{display:block;height:100%;background:var(--acc)}
.daychip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.daychip[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.daychip[aria-pressed="true"] .dp{background:rgba(255,255,255,.25)}
.daychip[aria-pressed="true"] .dp i{background:var(--acc2)}
.daychip.today{position:relative}
.daychip.today::before{content:"النهارده";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--acc2);color:var(--acc);font-size:.62rem;font-weight:700;border-radius:10px;padding:0 7px;white-space:nowrap}
.daychip.today:not([aria-pressed="true"]){border-color:var(--acc-t);border-width:2px}
.daychips{padding-top:8px}
.timeline{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:8px 16px;box-shadow:var(--shadow)}
.tl-row{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:stretch}
.tl-row:last-child{border-bottom:none}
.tl-time{position:relative;padding-inline-start:16px}
.tl-time::before{content:"";position:absolute;inset-inline-start:0;top:6px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.tl-time::after{content:"";position:absolute;inset-inline-start:4px;top:20px;bottom:-14px;width:1px;background:var(--line)}
.tl-row:last-child .tl-time::after{display:none}
.tl-time b{display:block;font-size:.9rem;font-variant-numeric:tabular-nums}
.tl-time span{font-size:.75rem;color:var(--muted);white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- cards & sections ---------- */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 12px;flex-wrap:wrap}
.sec h2{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.08rem;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--acc)}
.sec span{font-size:.82rem;color:var(--muted)}
h3{font-size:.95rem;font-weight:600;margin:0 0 14px}

/* todos */
.todo{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2)}
.todo:last-of-type{border-bottom:none}
.todo .tt-t{flex:1;font-size:.92rem;unicode-bidi:plaintext;text-align:right}
.todo.done .tt-t{text-decoration:line-through;color:var(--muted)}
.dtag{font-size:.72rem;color:var(--acc-t);background:color-mix(in srgb,var(--acc) 8%,var(--sheet));border-radius:12px;padding:2px 10px;white-space:nowrap}
.todoadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.todoadd input{flex:1;min-width:200px}
.xbtn{background:none;border:none;color:var(--muted);font-size:.9rem;padding:4px 8px;border-radius:8px}
.xbtn:hover{color:var(--bad);background:var(--empty)}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--acc-t)}
.chk:checked{background:var(--acc);border-color:var(--acc)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

textarea{width:100%;min-height:110px;resize:vertical;line-height:1.7}

/* pills */
.pill{display:inline-block;min-width:44px;padding:2px 9px;border-radius:10px;font-weight:600;font-size:.76rem;font-variant-numeric:tabular-nums}
.p-good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.p-mid{background:color-mix(in srgb,var(--mid) 16%,transparent);color:var(--mid)}
.p-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}

/* ---------- dashboard ---------- */
.rangebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;box-shadow:var(--shadow)}
.rangebar .lbl{font-size:.84rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi.lead{background:var(--acc);color:#fff;border-color:var(--acc);position:relative;overflow:hidden;isolation:isolate}
.kpi.lead::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.14;z-index:-1}
.kpi.lead span{color:rgba(255,255,255,.8)}
.kpi b{display:block;font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.75rem;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.hbar{display:grid;grid-template-columns:120px 1fr 96px;gap:12px;align-items:center;font-size:.86rem;margin-bottom:11px}
.hbar .tr{position:relative;height:10px;background:var(--empty);border-radius:6px;overflow:hidden}
.hbar .tr i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px}
.hbar .tr i.p{opacity:.22}
.hbar span:last-child{text-align:end;color:var(--ink-soft);font-size:.78rem;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(13,minmax(0,46px));gap:6px;justify-content:start}
.heat button{aspect-ratio:1;border-radius:8px;border:none;font-size:.68rem;padding:0;color:var(--ink-soft);background:var(--empty);font-variant-numeric:tabular-nums;position:relative}
.heat button.l1{background:color-mix(in srgb,var(--a) 22%,var(--sheet));color:var(--ink)}
.heat button.l2{background:color-mix(in srgb,var(--a) 48%,var(--sheet));color:#fff}
.heat button.l3{background:color-mix(in srgb,var(--a) 75%,var(--sheet));color:#fff}
.heat button.l4{background:var(--a);color:#fff}
.heat button.fut{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.heat button.inr::after{content:"";position:absolute;inset:-3px;border-radius:10px;border:1.5px solid var(--acc2)}
.heat button.cur{font-weight:700;box-shadow:inset 0 0 0 2px var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:"Readex Pro",sans-serif}
table.dt{width:100%;border-collapse:collapse;font-size:.86rem}
.dt th,.dt td{padding:11px 8px;border-bottom:1px solid var(--line-2);text-align:center}
.dt tbody tr:last-child td{border-bottom:none}
.dt th:first-child,.dt td:first-child{text-align:start}
.dt thead th{color:var(--muted);font-weight:500;font-size:.78rem;border-bottom:1px solid var(--line)}
.dt .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.insights{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.insights li{display:flex;gap:12px;align-items:flex-start;line-height:1.7}
.insights li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--acc2);margin-top:10px;transform:rotate(45deg)}
.up{color:var(--good);font-weight:600} .down{color:var(--bad);font-weight:600}
.keys{display:flex;gap:16px;font-size:.8rem;color:var(--ink-soft);margin-bottom:10px;flex-wrap:wrap}
.keys i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}

/* ---------- settings ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--ink-soft)}
.catrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.catrow input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--sheet)}
.catrow input[type=text]{flex:1;min-width:160px}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sheet)}
.tcard .tp{height:62px;background:var(--a);position:relative;overflow:hidden}
.tcard .tp::before{content:"";position:absolute;inset:0;background-image:var(--tp);opacity:.22}
.tcard .tp::after{content:"";position:absolute;width:30px;height:30px;border-radius:8px;background:var(--b);bottom:10px;left:12px}
.tcard div:last-child{padding:8px 12px;font-size:.8rem}

/* ---------- dialog & toast ---------- */
dialog{border:none;border-radius:20px;padding:0;background:var(--sheet);color:var(--ink);width:min(470px,92vw);box-shadow:0 24px 70px rgba(10,15,40,.3)}
dialog::backdrop{background:rgba(14,17,32,.5);backdrop-filter:blur(2px)}
.dlg-in{padding:24px}
.dlg-in h3{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.05rem;margin-bottom:16px}
.dlg-in .form{grid-template-columns:1fr}
.dlg-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
.dlg-act .danger{margin-inline-end:auto}
.ck{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important}
.ck input{accent-color:var(--acc);width:17px;height:17px}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- print ---------- */
#printArea{display:none;font-size:11px}
#printArea .board,#printArea .card,#printArea .kpi{box-shadow:none}
#printArea .scroller{overflow:visible}
#printArea table.tt{min-width:0}
#printArea .slot{min-height:44px;padding:5px 7px}
#printArea .quote{padding:10px 18px;margin-top:8px}#printArea .quote blockquote{font-size:1.1rem;line-height:1.6}#printArea .q-mark{font-size:5rem}
#printArea.pr-week .pr-h2{margin:10px 0 6px}
#printArea.pr-week .card{padding:10px 14px}
#printArea.pr-week .tt thead th{padding:8px 4px 6px}
#printArea.pr-week .tt .time{padding:6px 10px}
#printArea.pr-week .legend{margin:6px 0}
#printArea .pr-bottom{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
#printArea .pr-bottom>div:only-child{grid-column:1/-1}
#printArea .pr-todos{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
#printArea .pr-todos .todo{padding:5px 2px}
.pr-head{position:relative;overflow:hidden;background:var(--acc);color:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;isolation:isolate}
.pr-head::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.16;z-index:-1}
.pr-head h1{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.5rem;margin:0}
.pr-head .s{opacity:.85;font-size:.85rem}
.pr-foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft)}
.pr-h2{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1rem;margin:16px 0 8px}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11px}
  body.printing .appbar,body.printing .wrap,body.printing dialog,body.printing .toast{display:none!important}
  body.printing #printArea{display:block}
  .board,.card,.kpi{box-shadow:none}
  .scroller{overflow:visible}
  table.tt{min-width:0}
  .slot{min-height:52px;padding:6px 7px}
  .card,.kpi,.tt tr,.hbar,.board,.quote{break-inside:avoid}
  #printArea.one-page{break-inside:avoid;page-break-inside:avoid}
  #printArea .pr-bottom{break-inside:avoid;page-break-inside:avoid}
  #printArea .pr-h2{break-after:avoid;page-break-after:avoid}
  .quote{padding:12px 20px}.quote blockquote{font-size:1.15rem}.q-mark{font-size:6rem}
  .no-print{display:none!important}
  .grid2{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:22px}
  .rings{justify-content:space-between}
  .appbar-in{padding:10px 14px}
  .tabs{width:100%;overflow-x:auto}
  .tabs button{flex:1;white-space:nowrap;padding:7px 10px}
  .wrap{padding:16px 12px 64px}
}
@media (max-width:560px){
  .wk-num{font-size:3.3rem}
  .ring,.ring svg{width:64px}.ring svg{height:64px}.ring b{top:20px;font-size:.9rem}
  .hbar{grid-template-columns:88px 1fr 76px}
  .heat{grid-template-columns:repeat(7,minmax(0,1fr))}
  .wk-ctl{flex-wrap:nowrap}.hsel{flex:1;min-width:0;field-sizing:fixed}
  .daychip b{font-size:.74rem}.daychip span{display:none}
  .tl-row{grid-template-columns:74px 1fr;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- cloud sync ---------- */
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);white-space:nowrap}
.syncpill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.syncpill[data-s="ok"] i{background:var(--good)}.syncpill[data-s="busy"] i{background:var(--mid)}.syncpill[data-s="err"] i{background:var(--bad)}
.syncpill[hidden]{display:none}
.syncbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.syncbox input{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--sheet)}
.steps{margin:6px 0 0;padding-inline-start:20px;color:var(--ink-soft);font-size:.88rem;line-height:1.9}
.steps a{color:var(--acc-t);font-weight:600}
/* ---------- language modes ---------- */
.bi{display:block;direction:ltr;unicode-bidi:isolate;font-size:.9em;opacity:.8}
.empty .bi{text-align:center}
.slot .bi{display:block;direction:ltr;text-align:left;font-size:11.5px;font-weight:500;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.q-en{direction:ltr;text-align:left;margin:8px 0 0;font-family:"Amiri",serif;font-size:1.05rem;line-height:1.6;color:var(--ink-soft)}
.langseg button{padding:6px 11px;white-space:nowrap}
.rangebar .langseg{margin-inline-start:auto}
[dir=ltr] .slot,[dir=ltr] .slot b,[dir=ltr] .slot em,[dir=ltr] .todo .tt-t{text-align:left}
[dir=ltr] .slot b{padding-left:0;padding-right:22px}
[dir=ltr] .slot .tick{left:auto;right:8px}
[dir=ltr] .q-mark{left:auto;right:22px}
[dir=ltr] .hero::before{-webkit-mask-image:linear-gradient(to right,#000 10%,transparent 85%);mask-image:linear-gradient(to right,#000 10%,transparent 85%)}
[dir=ltr] .hbtn svg,[dir=ltr] .qbtn svg{transform:scaleX(-1)}
[dir=ltr] .quote blockquote{font-family:"Amiri",serif}
.daychip.today::before{content:var(--today-lbl,"النهارده")}


/* ---------- cell editor: repeat days & loop tracks ---------- */
dialog{max-height:min(92vh,960px);overflow:auto}
dialog.wide{width:min(620px,94vw)}
.dlg-act{position:sticky;bottom:0;background:var(--sheet);margin:18px -24px -24px;padding:12px 24px 20px;border-top:1px solid var(--line-2)}
.fld{display:flex;flex-direction:column;gap:7px;font-size:.84rem;color:var(--ink-soft)}
.fld-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.form .radio-seg label,.form .daypick label{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:.84rem}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{position:relative;border:1px solid var(--line);border-radius:10px;padding:5px 11px;cursor:pointer;user-select:none;background:var(--sheet)}
.daypick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.daypick label:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
.daypick label:has(input:focus-visible){outline:2px solid var(--acc2);outline-offset:2px}
.daypick label.cur::after{content:"";position:absolute;top:-3px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;background:var(--acc2);border:2px solid var(--sheet)}
.linkbtn{background:none;border:none;padding:0;color:var(--acc-t);font-size:.8rem;font-weight:500}
.seqbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--empty) 40%,var(--sheet))}
.srow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.snum{width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--acc) 12%,var(--sheet));color:var(--acc-t);font-size:.74rem;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.srow input{width:100%}
.sact{display:flex;gap:2px}
.sact .xbtn:disabled{opacity:.3;cursor:default}
.seqprev{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.seqprev>div{background:var(--sheet);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px}
.seqprev h4{margin:0 0 4px;font-size:.76rem;font-weight:600;color:var(--muted)}
.seqprev p{margin:0;display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:.78rem;line-height:1.5;color:var(--ink)}
.seqprev p span:first-child{color:var(--ink-soft)}
.seqprev p span:last-child{unicode-bidi:plaintext}
.seqprev p b{color:var(--acc-t);font-weight:600;margin-inline-end:4px}
.seqmark{display:none;top:auto!important;bottom:7px;position:absolute;top:9px;left:8px;font-style:normal;font-size:10px;font-weight:700;color:var(--ink);background:var(--sheet);border-radius:8px;padding:0 6px;line-height:18px}
.slot .seqmark{display:block}
.slot:has(.seqmark){padding-bottom:28px}
[dir=ltr] .seqmark{left:auto;right:8px}

/* ---------- motivation: level, streak, quests, weekly boss ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.15fr) minmax(0,1.1fr);margin-top:16px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.play>div{padding:16px 18px;min-width:0}
.play>div+div{border-inline-start:1px solid var(--line)}
.pl-h{font-size:.8rem;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.pl-h a,.pl-h button{color:var(--acc-t);font-weight:600;background:none;border:none;padding:0;font-size:.78rem}
.lvl{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lvl-b{width:54px;height:54px;border-radius:15px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-weight:700;font-size:1.45rem;flex:none;position:relative;overflow:hidden;isolation:isolate}
.lvl-b::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.25;z-index:-1}
.lvl-b::after{content:"";position:absolute;width:16px;height:16px;border-radius:5px;background:var(--acc2);bottom:-5px;inset-inline-end:-5px}
.lvl strong{display:block;font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1rem;line-height:1.4}
.lvl small{font-size:.78rem;color:var(--muted)}
.bar{height:9px;border-radius:6px;background:var(--empty);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .5s ease}
.bar.gold i{background:var(--acc2)}
.bar.hp{height:12px}.bar.hp i{background:var(--bad)}
.barlbl{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.fire{display:flex;align-items:baseline;gap:8px}
.fire b{font-family:"Noto Kufi Arabic","Readex Pro",sans-serif;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.fire span{font-size:.82rem;color:var(--ink-soft)}
.chain{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:10px 0 0}
.chain i{height:28px;border-radius:8px;background:var(--empty);display:grid;place-items:center;font-style:normal;font-size:.68rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chain i.hit{background:var(--acc2);color:#000;font-weight:700}
.chain i.miss{background:color-mix(in srgb,var(--bad) 20%,var(--sheet));color:var(--bad);font-weight:700}
.chain i.rest{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.chain i.pending{box-shadow:inset 0 0 0 2px var(--acc-t);color:var(--ink);font-weight:700}
.nudge{font-size:.82rem;color:var(--ink);margin:10px 0 0;font-weight:500;line-height:1.55}
.quest{display:flex;align-items:center;gap:9px;font-size:.85rem;padding:5px 0}
.quest .qk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:.72rem;font-style:normal;background:var(--sheet)}
.quest.ok .qk{background:var(--good);border-color:var(--good);color:#fff}
.quest.ok span{text-decoration:line-through;color:var(--muted)}

<script>

/* ============ data ============ */
const KEY='weekly-planner-52-v1';
/* weekday names, Sunday-first; the visible order is rotated so the week starts on whatever day you chose */
const DOW_AR=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DOW_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_EN_S=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let DAYS_AR=[],DAYS_EN=[],DAYS_EN_S=[],DAYS=[];
function setDays(dow){const r=a=>a.map((_,i)=>a[(i+dow)%7]);DAYS_AR=r(DOW_AR);DAYS_EN=r(DOW_EN);DAYS_EN_S=r(DOW_EN_S)}
const DAY_MS=864e5;
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());

const DEFAULT_QUOTES=[
  'حريٌّ بك أن تتذكّر أن السعي لطلب العلم هو توفيقٌ من الله، ورزقٌ ساقه إليك.',
  'الانتفاع بالعلم فتحٌ من الله ومِنّة، لذلك لا بد من تجديد النية، وإظهار الحاجة والافتقار إلى المولى سبحانه.',
  'تخلّص من كل فكرةٍ تُشعرك أن ما تقوم به هو من حولك وقوتك، وإيّاك أن تُعجب بنفسك.',
  'طريق العلم طريقٌ محفوفٌ بالابتلاءات وقواطع الطريق، لذلك فأنت تحتاج إلى الصبر والمجاهدة.',
  'قد يُحرم المرء فضل العلم ويُحجب عنه بسبب ذنب، فلا يفارقنّ لسانك الاستغفار.',
  'الدعاء من أقوى الأسلحة، فلا تفتر أن تدعو الله أن يشرح صدرك، وينفعك بهذا العلم، ويوفقك للعمل الصالح، وأن تكون من أهل الجنة.'
];
function defaults(){
  const C=(t,s,c,star)=>({t,s,c,star:!!star});
  const all=x=>Array.from({length:7},()=>({...x}));
  return {
    title:'الجدول الأسبوعي', subtitle:'قرآن ومهارات ومحاسبة، كل يوم بخطوة ثابتة',
    owner:'', fixedTheme:'', start:'2026-10-18', startV:3,
    quotesTitle:'وصايا غالية', quotes:DEFAULT_QUOTES.slice(), weeksCount:52, theme:'auto',
    cats:[
      {id:'q',name:'القرآن والذكر',color:'#1E6B50'},
      {id:'t',name:'المهارات التقنية',color:'#2563A8'},
      {id:'a',name:'المحاسبة والشهادات',color:'#7B3A68'},
      {id:'f',name:'مراجعة',color:'#8A90A8'}
    ],
    template:{
      slots:[
        {id:'s1',start:'04:00',end:'06:00'},
        {id:'s2',start:'06:00',end:'09:00'},
        {id:'s3',start:'11:00',end:'12:00'},
        {id:'s4',start:'21:00',end:'23:00'}
      ],
      cells:{
        s1:all(C('Religion','N. Pray + Quran + Azkar + Sharia','q',1)),
        s2:all({t:'CMA',s:'',c:'a',star:true,seq:'sq_cma'}),
        s3:[C('Excel','','t'),C('IQ + AI','','t',1),C('Entrepreneurship','','t',1),C('ERP','','t'),C('Entrepreneurship','','t',1),C('IQ + AI','','t',1),C('Power BI','','t')],
        s4:[C('Accounting 101','Basics + exercises','a'),{t:'IFRS',s:'',c:'a',star:false,seq:'sq_ifrs'},{t:'IFRS',s:'',c:'a',star:false,seq:'sq_ifrs'},{t:'IFRS',s:'',c:'a',star:false,seq:'sq_ifrs'},
            {t:'IFRS',s:'',c:'a',star:false,seq:'sq_ifrs'},{t:'IFRS',s:'',c:'a',star:false,seq:'sq_ifrs'},C('Accounting 101','Basics + exercises','a')]
      }
    },
    seqs:{
      sq_cma:{name:'CMA',steps:['Watch Video & Absorb','Deep Study + Summarize','Solve Questions Deeply','Watch Video + Reading + Deep Study to Weak Spots','Re-attempt Questions & End The Session','Revision to the End Topics','Revision to the End Topics'],mode:'progress',aD:'2026-10-10',aStep:0},
      sq_ifrs:{name:'IFRS',steps:['Watch Video & Absorb','Deep Study + Summarize','Solve Questions Deeply','Watch Video + Reading + Deep Study to Weak Spots','Re-attempt Questions & Quick Revision'],mode:'progress',aD:'2026-10-10',aStep:0}
    },
    print:{o:'landscape',fit:'one',quote:true,todos:true,notes:true},
    game:{thr:60},
    rewards:{items:[
      {id:'r1',name:'حلقة من مسلسل بحبه',cost:150},
      {id:'r2',name:'أكلة بحبها',cost:350},
      {id:'r3',name:'خروجة مع الصحاب',cost:700},
      {id:'r4',name:'حاجة نفسي أشتريها',cost:1500}],log:[]},
    weeks:{}
  };
}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}
if(!state||!state.template){state=defaults()}else{const raw=state;state={...defaults(),...raw};
  if(raw.owner==='Mohamed Ghaith'){state.owner='';try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  if(!raw.startV||raw.startV<2){state.startV=2}}
/* one-time switch of the master schedule to the requested layout (Religion / CMA track / skills / IFRS track) */
function migrateLayout(st){
  if(!st||(st.layoutV||0)>=3)return false;
  const D=defaults(),oldTpl=JSON.stringify(st.template||{});
  for(const k in (st.weeks||{})){const w=st.weeks[k];if(!w)continue;const tracked=Object.keys(w.done||{}).length>0;
    if(tracked&&!w.plan)w.plan=JSON.parse(oldTpl);          /* weeks you already ticked keep their history */
    else if(!tracked&&w.plan)w.plan=null;}                    /* untouched weeks follow the new master */
  st.template=D.template;st.seqs={...(st.seqs||{}),...D.seqs};
  st.cats=st.cats||[];D.cats.forEach(c=>{if(!st.cats.some(x=>x.id===c.id))st.cats.push(c)});
  st.layoutV=3;return true;
}
/* v4: habits removed, loop tracks anchored to a date (survives changing the week start), motivation data */
function migrateV4(st){
  if(!st)return false;let ch=false;
  if(st.habits){delete st.habits;ch=true}
  for(const k in st.weeks||{}){const w=st.weeks[k];if(w&&w.habits){delete w.habits;ch=true}}
  if(st.print&&'habits' in st.print){delete st.print.habits;ch=true}
  for(const id in st.seqs||{}){const q=st.seqs[id];if(q&&!q.mode){
    q.mode=q.cont?'calendar':'weekly';const d=parseISO(st.start);d.setDate(d.getDate()+((q.aW||1)-1)*7);q.aD=iso(d);
    delete q.cont;delete q.aW;delete q.days;ch=true}}
  if(!st.game){st.game={thr:60};ch=true}
  /* accept every rewards format: {items,log}, a plain list of rewards, or a separate "redeemed" list */
  if(Array.isArray(st.rewards)){st.rewards={items:st.rewards,log:[]};ch=true}
  if(!st.rewards||typeof st.rewards!=='object'){st.rewards={items:defaults().rewards.items,log:[]};ch=true}
  if(!Array.isArray(st.rewards.items)){st.rewards.items=defaults().rewards.items;ch=true}
  if(!Array.isArray(st.rewards.log)){st.rewards.log=[];ch=true}
  if(Array.isArray(st.redeemed)){st.redeemed.forEach(r=>{if(r&&!st.rewards.log.some(x=>x.id===r.id))st.rewards.log.push({id:r.id||uid(),name:r.name,cost:+r.cost||0,at:r.at})});delete st.redeemed;ch=true}
  st.rewards.items=st.rewards.items.filter(x=>x&&x.name).map(x=>({id:x.id||uid(),name:x.name,cost:+x.cost||0}));
  st.rewards.log=st.rewards.log.filter(Boolean).map(x=>{let at=x.at;if(typeof at==='number'||!/^\d{4}-\d{2}-\d{2}$/.test(String(at||'')))at=iso(at?new Date(at):new Date());return {...x,cost:+x.cost||0,at}});
  return ch;
}
/* one-time: week 1 = Sunday 18 Oct 2026; every tick and task stays on its real date */
function migrateStart(){if((state.startV||0)>=3)return false;rebase('2026-10-18');state.startV=3;return true}
if(migrateLayout(state)|migrateV4(state)|migrateStart()){state._t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function save(){state._t=Date.now();SEQC=null;game.c=null;if(typeof schedulePush==='function')schedulePush();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast(T('تعذّر الحفظ في المتصفح، اعمل نسخة احتياطية من الإعدادات','Could not save in this browser. Download a backup from Settings.'))}}

/* ============ language: ar | bi | en ============ */
const L=()=>(state&&state.lang==='en')?'en':'ar';
function T(a,e){const l=L();return l==='en'?e:l==='bi'?`${a} · ${e}`:a}
function TP(a,e){const l=L();return l==='en'?e:l==='bi'?`${a}<span class="bi">${e}</span>`:a}
const TR={

/* loop tracks: a cell can point at a track (a list of steps). Every place the track appears — any day,
   any time slot, any week — is one stop on the same cycle, in date-then-time order.
   mode progress: each stop shows the step that's due; a stop you didn't tick keeps the step waiting for the next stop
   mode calendar: each stop takes the next step whether or not you ticked it, and keeps going week after week
   mode weekly:   the cycle restarts at the chosen step every week                                                   */
const seqOf=id=>(state.seqs||{})[id];
var SEQC=null;
function seqMap(id){
  SEQC=SEQC||{};if(SEQC[id])return SEQC[id];
  const q=seqOf(id),m=new Map();SEQC[id]=m;if(!q||!q.steps||!q.steps.length)return m;
  const N=q.steps.length,occ=[];
  for(let n=1;n<=state.weeksCount;n++){const p=getPlan(n),sl=[...p.slots].sort((a,b)=>toMin(a.start)-toMin(b.start));
    for(let i=0;i<7;i++)sl.forEach(x=>{const c=(p.cells[x.id]||[])[i];if(c&&c.seq===id)occ.push({n,i,sid:x.id,D:(n-1)*7+i})})}
  const aD=q.aD?Math.round((parseISO(q.aD)-parseISO(state.start))/DAY_MS):0;
  let f=occ.findIndex(o=>o.D>=aD);if(f<0)f=occ.length;
  const a=q.aStep||0,wr={};let dc=0;
  occ.forEach((o,p)=>{let x;
    if(q.mode==='weekly'){wr[o.n]=wr[o.n]||0;x=a+wr[o.n];wr[o.n]++}
    else if(q.mode==='calendar'||p<f)x=a+(p-f);
    else{x=a+dc;if((((state.weeks[o.n]||{}).done)||{})[o.sid+'_'+o.i])dc++}
    m.set(o.n+'|'+o.i+'|'+o.sid,((x%N)+N)%N)});
  return m;
}
function seqStep(id,n,i,sid){const k=seqMap(id).get(n+'|'+i+'|'+sid);return k==null?-1:k}
function seqFirstThisWeek(id,n){for(const [k,v] of seqMap(id)){if(+k.split('|')[0]===n)return v}return -1}
function rc(c,n,i,sid){if(!c||!c.seq)return c;const q=seqOf(c.seq);if(!q||!q.steps||!q.steps.length)return c;const k=seqStep(c.seq,n,i,sid);if(k<0)return c;return {...c,s:q.steps[k],_sq:[k+1,q.steps.length]}}

/* keep past weeks frozen before master edits so the dashboard stays accurate */
function freezePast(upTo){const snap=JSON.stringify(state.template);
  for(let n=1;n<upTo;n++){const x=getWeek(n,true);if(!x.plan)x.plan=JSON.parse(snap)}}
function doneInSlot(n,id){const w=state.weeks[n];return w?Object.keys(w.done||{}).filter(k=>k.startsWith(id+'_')).length:0}
/* the plans an edit lands on: this week only, or the master schedule plus every custom week from this week onward */
function targetPlans(){
  if(ui.scope==='week'){const w=getWeek(ui.week,true);if(!w.plan)w.plan=clone(state.template);return [w.plan]}
  freezePast(ui.week);const out=[state.template];
  for(const k in state.weeks){const w=state.weeks[k];if(+k>=ui.week&&w&&w.plan&&w.plan!==state.template)out.push(w.plan)}
  return out;
}
function ensureSlot(p,id){if(p.slots.some(x=>x.id===id))return true;const src=getPlan(ui.week).slots.find(x=>x.id===id);if(!src)return false;
  p.slots.push({...src});p.cells[id]=p.cells[id]||Array(7).fill(null);return true}

/* move the week grid to a new day-1 date while every tick, task and note stays on its real calendar date */
/* dates of the chosen weekday around today, for "week 1 starts on" */
function startOpts(dow,curISO){
  const t=sod(new Date()),base=new Date(t);base.setDate(t.getDate()-((t.getDay()-dow+7)%7));
  const cur=parseISO(curISO);let best=null,bd=1e9;const ds=[];
  for(let k=-12;k<=6;k++){const d=new Date(base);d.setDate(base.getDate()+k*7);ds.push(d);const df=Math.abs(d-cur);if(df<bd){bd=df;best=iso(d)}}
  return ds.map(d=>{const v=iso(d),tag=v===iso(t)?T(' (النهارده)',' (today)'):(k=>k===0?T(' (الأسبوع ده)',' (this week)'):k===7?T(' (الأسبوع الجاي)',' (next week)'):'')(Math.round((d-base)/DAY_MS));
    return `<option value="${v}" ${v===best?'selected':''}>${L()==='en'?DOW_EN[d.getDay()]:DOW_AR[d.getDay()]} ${fmtD(d)} ${d.getFullYear()}${tag}</option>`}).join('');
}
function wkPrevText(ns){
  const st=parseISO(ns),dn=Math.floor((sod(new Date())-st)/DAY_MS),end=new Date(st);end.setDate(st.getDate()+6);
  const first=T(`أسبوع 1: من ${DOW_AR[st.getDay()]} ${fmtD(st)} لـ ${DOW_AR[end.getDay()]} ${fmtD(end)}.`,`Week 1: ${DOW_EN[st.getDay()]} ${fmtD(st)} to ${DOW_EN[end.getDay()]} ${fmtD(end)}.`);
  if(dn<0)return first+' '+T(-dn===1?'بيبدأ بكرة.':`بيبدأ بعد ${-dn} أيام.`,-dn===1?'Starts tomorrow.':`Starts in ${-dn} days.`);
  return first+' '+T(`الأسبوع اللي إحنا فيه هيبقى أسبوع ${Math.floor(dn/7)+1}.`,`The current week becomes week ${Math.floor(dn/7)+1}.`);
}
function applyStart(ns){

}
function rebase(ns){
  const os=state.start;if(!ns||ns===os)return false;
  const off=Math.round((parseISO(os)-parseISO(ns))/DAY_MS),md=x=>((x%7)+7)%7,loc=D=>({n:Math.floor(D/7)+1,i:md(D)});
  const rot=cells=>{const o={};for(const k in cells||{}){const r=cells[k]||[],a=Array(7).fill(null);for(let i=0;i<7;i++)a[md(i+off)]=r[i]??null;o[k]=a}return o};
  state.template.cells=rot(state.template.cells);
  const NW={},g=n=>NW[n]||(NW[n]={plan:null,done:{},note:'',todos:[]});
  Object.keys(state.weeks).map(Number).sort((a,b)=>a-b).forEach(n=>{const w=state.weeks[n];if(!w)return;
    const t=g(loc((n-1)*7+3+off).n);
    if(w.plan&&!t.plan)t.plan={...clone(w.plan),cells:rot(w.plan.cells)};
    if(w.theme&&!t.theme)t.theme=w.theme;
    if(w.note)t.note=t.note?t.note+'\n\n'+w.note:w.note;
    for(const k in w.done||{}){const j=k.lastIndexOf('_'),L=loc((n-1)*7+(+k.slice(j+1))+off);g(L.n).done[k.slice(0,j)+'_'+L.i]=true}
    (w.todos||[]).forEach(td=>{if(td.day!=null&&td.day!==''){const L=loc((n-1)*7+(+td.day)+off);g(L.n).todos.push({...td,day:L.i})}else t.todos.push({...td})});
  });
  for(const k in NW){const w=NW[k];if(!w.todos.length)delete w.todos}
  state.weeks=NW;state.start=ns;SEQC=null;game.c=null;return true;
}

/* ============ stats ============ */
function weekStats(n){
  const plan=getPlan(n),w=state.weeks[n]||{done:{}};
  const r={n,pMin:0,dMin:0,pCnt:0,dCnt:0,cat:{},subj:{},day:Array.from({length:7},()=>({p:0,d:0}))};
  plan.slots.forEach(s=>{const m=dur(s);(plan.cells[s.id]||[]).forEach((c,i)=>{
    if(!c||!c.t)return;const d=!!(w.done||{})[s.id+'_'+i];
    r.pMin+=m;r.pCnt++;if(d){r.dMin+=m;r.dCnt++}
    const cc=r.cat[c.c]||(r.cat[c.c]={p:0,d:0});cc.p+=m;if(d)cc.d+=m;
    const k=c.t.trim();const ss=r.subj[k]||(r.subj[k]={cat:c.c,p:0,d:0,pc:0,dc:0});ss.p+=m;ss.pc++;if(d){ss.d+=m;ss.dc++}
    r.day[i].p+=m;if(d)r.day[i].d+=m;})});
  const td=w.todos||[];r.tP=td.length;r.tD=td.filter(t=>t.done).length;
  r.pct=r.pMin?Math.round(r.dMin/r.pMin*100):0;
  return r;
}
function aggregate(from,to){
  const A={pMin:0,dMin:0,pCnt:0,dCnt:0,cat:{},subj:{},day:Array.from({length:7},()=>({p:0,d:0})),tP:0,tD:0,weeks:[]};
  for(let n=from;n<=to;n++){const r=weekStats(n);A.weeks.push(r);
    ['pMin','dMin','pCnt','dCnt','tP','tD'].forEach(k=>A[k]+=r[k]);
    for(const k in r.cat){const a=A.cat[k]||(A.cat[k]={p:0,d:0});a.p+=r.cat[k].p;a.d+=r.cat[k].d}
    for(const k in r.subj){const s=r.subj[k],a=A.subj[k]||(A.subj[k]={cat:s.cat,p:0,d:0,pc:0,dc:0});a.p+=s.p;a.d+=s.d;a.pc+=s.pc;a.dc+=s.dc}
    r.day.forEach((d,i)=>{A.day[i].p+=d.p;A.day[i].d+=d.d});}
  A.pct=A.pMin?Math.round(A.dMin/A.pMin*100):0;
  return A;
}

  return THEMES.find(t=>t.id===pick)||THEMES[(n-1)%THEMES.length];
}
function applyWeekTheme(n){
  const t=themeOf(n),r=document.documentElement.style;
  r.setProperty('--acc',t.a);r.setProperty('--acc2',t.b);r.setProperty('--pat',patternURI(t.pat,'#ffffff'));
  document.body.dataset.shape=t.shape;
  return t;
}

function hashN(str){let h=2166136261;for(let k=0;k<str.length;k++){h^=str.charCodeAt(k);h=Math.imul(h,16777619)}return h>>>0}
const XP={first:10,stars:25,all:50,boss:200,todo:15};
/* everything is derived from your ticks, so unticking takes points back and every device agrees */
function game(){
  if(game.c)return game.c;
  const N=state.weeksCount,tD=dayNo(new Date()),thr=(state.game&&+state.game.thr)||60;
  const G={xp:0,box:0,dMin:0,dCnt:0,perfect:0,bosses:0,perfectW:0,todos:0,days:[],weeks:[],today:null,tD,thr};
  for(let n=1;n<=N;n++){
    const p=getPlan(n),w=state.weeks[n]||{},dn=w.done||{};let wp=0,wd=0;
    const day=Array.from({length:7},()=>({p:0,d:0,pm:0,dm:0,sp:0,sd:0}));
    p.slots.forEach(x=>{const m=dur(x);(p.cells[x.id]||[]).forEach((c,i)=>{if(!c||!c.t)return;const y=day[i],ok=!!dn[x.id+'_'+i];
      y.p++;y.pm+=m;if(c.star)y.sp++;
      if(ok){y.d++;y.dm+=m;if(c.star)y.sd++;if((n-1)*7+i<=tD){G.xp+=Math.round(m/10*(c.star?1.5:1));G.dMin+=m;G.dCnt++}}})});
    day.forEach((y,i)=>{const D=(n-1)*7+i;wp+=y.pm;wd+=y.dm;
      const q={first:y.d>0,stars:y.sp>0&&y.sd===y.sp,all:y.p>0&&y.d===y.p};
      const st=!y.p?'rest':(y.d/y.p*100>=thr?'hit':(D<tD?'miss':D===tD?'pending':'future'));
      let box=0;
      if(D<=tD&&y.p){if(q.first)G.xp+=XP.first;if(q.stars)G.xp+=XP.stars;if(q.all){G.xp+=XP.all;G.perfect++;box=10+hashN(state.start+'#'+D)%31;G.box+=box}}
      G.days[D]={...y,st,q,box,n,i,D};});
    const started=(n-1)*7<=tD,pct=wp?Math.round(wd/wp*100):0;
    if(started&&wp>0&&pct===100)G.perfectW++;
    G.weeks[n]={hp:wp,dmg:wd,pct,started};
    G.todos+=(w.todos||[]).filter(t=>t.done).length;
  }
  G.xp+=G.todos*XP.todo;
  /* days before you ticked anything for the first time don't count as broken streak days */
  const f0=G.days.findIndex(y=>y&&y.d>0);G.days.forEach(y=>{if(y&&y.st==='miss'&&(f0<0||y.D<f0))y.st='rest'});
  /* weekly battle: 3 hearts; every day you let slip costs one; at 0 the boss escapes with the bounty */
  let ws=0;
  for(let n=1;n<=N;n++){const W=G.weeks[n];let miss=0,left=0;
    for(let i=0;i<7;i++){const y=G.days[(n-1)*7+i];if(y.st==='miss')miss++;if(y.D>=tD)left++}
    W.esc=false;W.def=W.started&&W.hp>0&&W.pct>=80;
    W.ws=ws;W.tier=ws>=4?2:ws>=2?1:0;W.bounty=Math.min(XP.boss+50*ws,500);W.left=Math.min(left,7);
    if(W.def){G.xp+=W.bounty;G.bosses++;ws++}else if(W.started&&W.hp>0&&(n-1)*7+6<tD)ws=0}
  G.winStreak=ws;
  G.today=G.days[tD]||null;
  const last=Math.min(tD,N*7-1);let cur=0;
  for(let D=last;D>=0;D--){const y=G.days[D];if(y.st==='hit')cur++;else if(y.st==='miss')break}
  let best=0,run=0;for(let D=0;D<=last;D++){const y=G.days[D];if(y.st==='hit'){run++;if(run>best)best=run}else if(y.st==='miss')run=0}
  G.streak=cur;G.best=best;G.level=lvOf(G.xp);
  G.spent=((state.rewards||{}).log||[]).reduce((a,r)=>a+(+r.cost||0),0);G.coins=G.xp+G.box-G.spent;
  G.badges=BADGES.filter(b=>b.ok(G)).map(b=>b.id);
  return game.c=G;
}
function lvBar(G){const a=lvXP(G.level),b=lvXP(G.level+1);return {pct:Math.round((G.xp-a)/(b-a)*100),left:b-G.xp}}
function nudge(G){const y=G.today;
  if(!y)return G.tD<0?T('الجدول لسه مبدأش. أول جلسة هتبدأ بيها السلسلة.','The plan hasn’t started yet. Your first session starts the streak.'):T('الفترة دي خارج الجدول.','Today is outside the plan.');
  if(!y.p)return T('النهارده راحة، والسلسلة مش هتتقطع.','Rest day today — your streak is safe.');
  if(y.q.all)return T(`يوم كامل! فتحت صندوق المفاجأة وكسبت ${y.box} عملة.`,`Perfect day! You opened the mystery box: +${y.box} coins.`);
  const need=Math.max(Math.ceil(G.thr/100*y.p)-y.d,0),left=y.p-y.d;
  if(need>0)return T(`فاضلك ${need} ${need===1?'جلسة':'جلسات'} عشان السلسلة (${G.streak} يوم) متتقطعش.`,`${need} more session${need===1?'':'s'} to keep your ${G.streak}-day streak alive.`);
  return T(`السلسلة اتأمنت النهارده 🔥 فاضلك ${left} ${left===1?'جلسة':'جلسات'} وتفتح صندوق المفاجأة.`,`Streak secured today 🔥 ${left} more to open the mystery box.`);
}
function chainHtml(G,from,to,cls){let h='';for(let D=from;D<=to;D++){const y=G.days[D];

function questsHtml(G){const y=G.today;

    [y&&y.q.stars,T('خلّص كل الأولويات ★','Finish every ★ priority'),'+'+XP.stars],

}
const TIERS=[['عادي','Normal'],['شرس','Fierce'],['أسطوري','Legendary']];
function bossHtml(G,n,big){
  const b=bossOf(n),W=G.weeks[n]||{hp:0,dmg:0,pct:0,def:false,esc:false,hearts:3,bounty:XP.boss,tier:0,ws:0,left:7,started:false};
  const st=W.def?'def':W.esc?'esc':'',hpLeft=W.def?0:Math.max(100-Math.round(W.pct/80*100),0),tier=TIERS[W.tier];

  else if(!W.started)msg=T(`المعركة بتبدأ أول يوم في الأسبوع. الجايزة ${W.bounty} XP`,`The fight starts on day one. Bounty: ${W.bounty} XP`);
  else msg=T(`كل جلسة ضربة. وصّله 80% قبل ما الأسبوع يخلص.`,`Every session is a hit. Bring it to 80% before the week ends.`);
  return `<div class="arena ${st} ${big?'big':''} t${W.tier}">
    <div class="ar-top"><span class="ar-tier">${T(`وحش ${tier[0]}`,`${tier[1]} boss`)}</span>${W.ws?`<span class="ar-ws">${T(`🔥 ${W.ws} انتصارات ورا بعض`,`🔥 ${W.ws} wins in a row`)}</span>`:''}</div>
    <div class="ar-mid">
      <div class="ar-info"><strong>${esc(b.name)}</strong>
        <div class="hpbar"><i style="width:${hpLeft}%"></i></div>
        <div class="ar-row"><span>${W.def?T('صحته 0%','Health 0%'):T(`صحته ${hpLeft}%`,`Health ${hpLeft}%`)}</span><span>${T(`ضرباتك ${W.pct}%`,`Your hits ${W.pct}%`)}</span></div>
        <div class="ar-row"><span class="ar-bounty">${T(`الجايزة ${W.bounty} XP`,`Bounty ${W.bounty} XP`)}</span></div></div></div>
    <p class="ar-msg">${msg}${W.started&&!W.def&&!W.esc&&W.hp&&isThisWeek(n)?` <b>${T(`باقي ${W.left} ${W.left===1?'يوم':'أيام'}`,`${W.left} day${W.left===1?'':'s'} left`)}</b>`:''}</p>
    ${big?battleLog(G,n):''}</div>`;
}
function battleLog(G,cur){let h='';const from=Math.max(1,cur-7);

function fitSlots(root){
  (root||document).querySelectorAll('.slot b, .slot em').forEach(el=>{
    el.style.fontSize='';el.style.whiteSpace='';
    const base=parseFloat(getComputedStyle(el).fontSize),pr=!!el.closest('#printArea'),min=el.tagName==='B'?(pr?8.5:10.5):(pr?8:9.5);let fs=base;
    if(el.clientWidth===0)return;
    if(el.tagName==='EM'){while(el.scrollHeight>el.clientHeight+1&&fs>min){fs-=.5;el.style.fontSize=fs+'px'}return}  /* details: up to 2 lines, shrink a little before clipping */
    while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=.5;el.style.fontSize=fs+'px'}
    if(el.scrollWidth>el.clientWidth+1)el.style.whiteSpace='normal';
  });
}
function fitQuote(){
  const el=document.querySelector('.quote blockquote:not([contenteditable])');if(!el)return;
  el.style.whiteSpace='nowrap';let fs=28;el.style.fontSize=fs+'px';
  while(el.scrollWidth>el.clientWidth&&fs>16){fs--;el.style.fontSize=fs+'px'}
  el.style.whiteSpace='';
}

function slotHtml(c,sid,i,done,interactive){

}
function slotText(c){
  const l=L(),et=trOf(c.t),es=c.s?trOf(c.s):'',star=c.star?'<span class="star">★</span>':'';
  if(l==='en')return `<b><bdi>${esc(et||c.t)}</bdi>${star}</b>${c.s?`<em>${esc(es||c.s)}</em>`:''}`;
  let h=`<b><bdi>${esc(c.t)}</bdi>${star}</b>${c.s?`<em>${esc(c.s)}</em>`:''}`;
  if(l==='bi'&&(et||es))h+=`<em class="bi">${[et,es].filter(Boolean).map(esc).join(' — ')}</em>`;
  return h;
}
function scheduleTable(n,interactive){

function lineChart(labels,series){
  const W=760,H=230,pl=40,pr=14,pt=14,pb=30,n=labels.length,iw=W-pl-pr,ih=H-pt-pb;
  const x=i=>pl+(n<=1?iw/2:i*iw/(n-1)),y=v=>pt+ih-v/100*ih;
  let g='';for(let v=0;v<=100;v+=25)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-7}" y="${y(v)+4}" class="ax" text-anchor="end">${v}%</text>`;
  const step=Math.ceil(n/14);labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${H-9}" class="ax" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{g+=`<polyline points="${s.values.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" style="fill:${s.color}"><title>${T('أسبوع','Week')} ${labels[i]}: ${v}%</title></circle>`)});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" dir="ltr" role="img" aria-label="${T('منحنى الإنجاز الأسبوعي','Weekly progress chart')}">${g}</svg>`;
}
function hbar(label,p,d,color,right){const pp=p?Math.round(d/p*100):0;
  return `<div class="hbar"><span>${label}</span><div class="tr"><i class="p" style="width:100%;background:${color}"></i><i style="width:${pp}%;background:${color}"></i></div><span>${right??pp+'%'}</span></div>`}

function viewDash(){
  const cur=currentWeek(),N=state.weeksCount;
  ui.from=Math.min(Math.max(ui.from,1),N);ui.to=Math.min(Math.max(ui.to,ui.from),N);
  const A=aggregate(ui.from,ui.to);
  const opt=(v)=>{let o='';for(let i=1;i<=N;i++)o+=`<option value="${i}" ${i===v?'selected':''}>${T('أسبوع','Week')} ${i}</option>`;return o};
  let h=`<div class="rangebar no-print"><span class="lbl">${T('الفترة من','Period from')}</span><select id="rFrom">${opt(ui.from)}</select><span class="lbl">${T('إلى','to')}</span><select id="rTo">${opt(ui.to)}</select>
    <button class="btn" data-range="todate">${T('لحد النهارده','To date')}</button><button class="btn" data-range="last4">${T('آخر 4 أسابيع','Last 4 weeks')}</button><button class="btn" data-range="q">${T('آخر 13 أسبوع','Last 13 weeks')}</button><button class="btn" data-range="year">${T('السنة كلها','Whole year')}</button>

}
function dashBody(A,cur,interactive){

  for(let n=1;n<=N;n++){const r=weekStats(n),fut=n>cur&&!r.dCnt,l=r.pct>=85?4:r.pct>=65?3:r.pct>=40?2:r.pct>0?1:0;

  h+=`</div><p class="hint" style="margin:10px 0 0">${TP('كل مربع أسبوع بلونه، وكل ما يغمق كل ما الإنجاز يزيد. المربعات المحاطة بإطار هي الفترة اللي التقرير بيحسبها.'+(interactive?' اضغط على أي أسبوع تفتحه.':''),'Each square is a week in its own color; the darker it is, the higher the completion. Outlined squares are the period the report covers.'+(interactive?' Tap any week to open it.':''))}</p></div>`;
  // trend
  h+=`<div class="sec"><h2>${T('الإنجاز أسبوع بأسبوع','Progress week by week')}</h2></div><div class="card">
    ${lineChart(A.weeks.map(w=>w.n),[{color:'var(--acc-t)',values:A.weeks.map(w=>w.pct)}])}</div>`;
  // cats & days
  h+=`<div class="grid2" style="margin-top:14px"><div class="card"><h3>${T('الساعات حسب القسم','Hours by category')}</h3>`;
  const cats=Object.keys(A.cat);if(!cats.length)h+=`<p class="hint">${T('لسه مفيش بيانات.','No data yet.')}</p>`;
  cats.forEach(k=>{const c=catOf(k),v=A.cat[k];h+=hbar(esc(C(c.name)),v.p,v.d,c.color,`${hrs(v.d)} / ${hrs(v.p)} ${T('س','h')}`)});
  h+=`<p class="hint" style="margin:6px 0 0">${TP('الجزء الفاتح هو المخطط، والغامق هو اللي اتعمل.','The light part is planned; the dark part is what got done.')}</p></div><div class="card"><h3>${T('أقوى وأضعف أيام الأسبوع','Strongest and weakest weekdays')}</h3>`;
  A.day.forEach((d,i)=>h+=hbar(DAYS[i],d.p,d.d,'var(--acc-t)'));

  // subjects
  const subs=Object.entries(A.subj).sort((a,b)=>b[1].p-a[1].p);
  h+=`<div class="sec"><h2>${T('تفاصيل كل مادة','Subject details')}</h2></div><div class="card" style="overflow-x:auto"><table class="dt"><thead><tr><th>${T('المادة','Subject')}</th><th>${T('القسم','Category')}</th><th>${T('جلسات خلصت','Sessions done')}</th><th>${T('ساعات خلصت','Hours done')}</th><th>${T('ساعات مخططة','Hours planned')}</th><th>${T('النسبة','Rate')}</th></tr></thead><tbody>`;
  subs.forEach(([k,v])=>{const p=v.p?Math.round(v.d/v.p*100):0,c=catOf(v.cat);
    h+=`<tr><td><b style="font-weight:600">${esc(C(k))}</b></td><td><span class="dot" style="background:${c.color}"></span>${esc(C(c.name))}</td><td>${v.dc} / ${v.pc}</td><td>${hrs(v.d)}</td><td>${hrs(v.p)}</td><td><span class="pill ${pctClass(p)}">${p}%</span></td></tr>`});

    h+=`<div class="sec"><h2>${T('قارن بين أسبوعين','Compare two weeks')}</h2></div><div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px" class="no-print"><select id="cmpA">${o(ui.cmpA)}</select><span>${T('مع','vs')}</span><select id="cmpB">${o(ui.cmpB)}</select></div>${compareTable(ui.cmpA,ui.cmpB)}</div>`;
  }
  return h;
}
function allTimeLog(){
  const cur=state.template,inPlan=new Set();
  Object.values(cur.cells).forEach(r=>(r||[]).forEach(c=>{if(c&&c.t)inPlan.add(c.t.trim())}));
  const L={};
  for(let n=1;n<=state.weeksCount;n++){const r=weekStats(n);for(const k in r.subj){const s=r.subj[k];if(!s.dc)continue;
    const a=L[k]||(L[k]={cat:s.cat,d:0,dc:0,first:n,last:n});a.d+=s.d;a.dc+=s.dc;a.last=n}}
  const rows=Object.entries(L).sort((a,b)=>b[1].d-a[1].d);
  let h=`<div class="sec"><h2>${T('سجل كل اللي اشتغلت عليه','Everything you worked on')}</h2><span>${T('سجل دائم للسنة كلها، مش بيتمسح لو شلت مادة من الجدول','A permanent log for the whole year — not erased if you remove a subject')}</span></div><div class="card" style="overflow-x:auto">`;
  if(!rows.length)return h+`<div class="empty"><b>${T('السجل لسه فاضي','The log is empty')}</b>${TP('أول ما تعلّم أي جلسة إنها خلصت هتظهر هنا.','As soon as you mark a session done, it will appear here.')}</div></div>`;
  h+=`<table class="dt"><thead><tr><th>${T('المادة','Subject')}</th><th>${T('القسم','Category')}</th><th>${T('جلسات خلصت','Sessions done')}</th><th>${T('إجمالي الساعات','Total hours')}</th><th>${T('من أسبوع','First week')}</th><th>${T('آخر أسبوع','Last week')}</th><th>${T('الحالة','Status')}</th></tr></thead><tbody>`;
  rows.forEach(([k,v])=>{const c=catOf(v.cat),on=inPlan.has(k);
    h+=`<tr><td><b style="font-weight:600">${esc(C(k))}</b></td><td><span class="dot" style="background:${c.color}"></span>${esc(C(c.name))}</td><td>${v.dc}</td><td>${hrs(v.d)}</td><td>${v.first}</td><td>${v.last}</td><td><span class="tag ${on?'on':'off'}">${on?T('في الجدول الأساسي','In master schedule'):T('خلصت / اتشالت من الجدول','Finished / removed')}</span></td></tr>`});
  return h+'</tbody></table></div>';
}
function compareTable(a,b){
  const A=weekStats(a),B=weekStats(b);
  const diff=(x,y,u='')=>{const d=Math.round((y-x)*10)/10;return d>0?`<span class="up">+${d}${u}</span>`:d<0?`<span class="down">${d}${u}</span>`:'—'};
  let h=`<div style="overflow-x:auto"><table class="dt"><thead><tr><th>${T('المقياس','Metric')}</th><th>${T('أسبوع','Week')} ${a}</th><th>${T('أسبوع','Week')} ${b}</th><th>${T('الفرق','Change')}</th></tr></thead><tbody>
    <tr><td>${T('إنجاز الجدول','Schedule completion')}</td><td>${A.pct}%</td><td>${B.pct}%</td><td>${diff(A.pct,B.pct,'%')}</td></tr>
    <tr><td>${T('ساعات اتعملت','Hours done')}</td><td>${hrs(A.dMin)}</td><td>${hrs(B.dMin)}</td><td>${diff(A.dMin/60,B.dMin/60)}</td></tr>
    <tr><td>${T('جلسات خلصت','Sessions done')}</td><td>${A.dCnt}/${A.pCnt}</td><td>${B.dCnt}/${B.pCnt}</td><td>${diff(A.dCnt,B.dCnt)}</td></tr>
    <tr><td>${T('مهام خلصت','Tasks done')}</td><td>${A.tD}/${A.tP}</td><td>${B.tD}/${B.tP}</td><td>${diff(A.tD,B.tD)}</td></tr>`;
  const ks=new Set([...Object.keys(A.cat),...Object.keys(B.cat)]);
  ks.forEach(k=>{const x=A.cat[k]||{d:0},y=B.cat[k]||{d:0};h+=`<tr><td>${T('ساعات','Hours:')} ${esc(C(catOf(k).name))}</td><td>${hrs(x.d)}</td><td>${hrs(y.d)}</td><td>${diff(x.d/60,y.d/60)}</td></tr>`});
  return h+'</tbody></table></div>';
}
function insights(A){
  const out=[];
  if(!A.pMin)return[T('مفيش خطة في الفترة دي.','No plan in this period.')];
  out.push(TP(`خلّصت <b>${A.pct}%</b> من الجدول في الفترة دي: ${hrs(A.dMin)} ساعة من ${hrs(A.pMin)} ساعة مخططة.`,`You completed <b>${A.pct}%</b> of the schedule in this period: ${hrs(A.dMin)} of ${hrs(A.pMin)} planned hours.`));
  if(A.tP)out.push(TP(`خلّصت ${A.tD} من ${A.tP} مهمة (${Math.round(A.tD/A.tP*100)}%).`,`You finished ${A.tD} of ${A.tP} tasks (${Math.round(A.tD/A.tP*100)}%).`));
  const ws=A.weeks.filter(w=>w.pMin&&w.n<=currentWeek());
  if(ws.length>1){const b=[...ws].sort((x,y)=>y.pct-x.pct);out.push(TP(`أحسن أسبوع كان أسبوع ${b[0].n} بنسبة ${b[0].pct}%، وأضعف أسبوع كان أسبوع ${b[b.length-1].n} بنسبة ${b[b.length-1].pct}%.`,`Best week was week ${b[0].n} at ${b[0].pct}%; weakest was week ${b[b.length-1].n} at ${b[b.length-1].pct}%.`))}
  const subs=Object.entries(A.subj).filter(([k,v])=>v.pc>=2).map(([k,v])=>[k,Math.round(v.d/v.p*100)]).sort((a,b)=>b[1]-a[1]);
  if(subs.length>1){const a0=esc(subs[0][0]),a1=esc(subs[subs.length-1][0]),e0=esc(trOf(subs[0][0])||subs[0][0]),e1=esc(trOf(subs[subs.length-1][0])||subs[subs.length-1][0]);out.push(TP(`أكتر مادة ملتزم بيها: <b>${a0}</b> (${subs[0][1]}%). أكتر مادة محتاجة اهتمام: <b>${a1}</b> (${subs[subs.length-1][1]}%).`,`Most consistent subject: <b>${e0}</b> (${subs[0][1]}%). Needs the most attention: <b>${e1}</b> (${subs[subs.length-1][1]}%).`))}
  const dd=A.day.map((d,i)=>[i,d.p?Math.round(d.d/d.p*100):0]).sort((a,b)=>b[1]-a[1]);
  if(A.dMin)out.push(TP(`أقوى يوم عندك ${DAYS_AR[dd[0][0]]} (${dd[0][1]}%)، وأضعف يوم ${DAYS_AR[dd[6][0]]} (${dd[6][1]}%).`,`Your strongest day is ${DAYS_EN[dd[0][0]]} (${dd[0][1]}%) and your weakest is ${DAYS_EN[dd[6][0]]} (${dd[6][1]}%).`));
  if(ws.length>=8){const l=ws.slice(-4),p=ws.slice(-8,-4),av=a=>Math.round(a.reduce((s,w)=>s+w.pct,0)/a.length),x=av(l),y=av(p);
    out.push(x>=y?TP(`متوسط آخر 4 أسابيع ${x}% مقابل ${y}% في الـ4 اللي قبلهم، يعني في تحسن.`,`Last 4 weeks averaged ${x}% vs ${y}% in the 4 before — that’s an improvement.`):TP(`متوسط آخر 4 أسابيع ${x}% مقابل ${y}% في الـ4 اللي قبلهم، يعني في تراجع محتاج تقف عنده.`,`Last 4 weeks averaged ${x}% vs ${y}% in the 4 before — a drop worth looking into.`))}
  return out;
}

/* ============ celebrations ============ */
function floatXP(x,y,txt){const s=document.createElement('div');s.className='fxp';s.textContent=txt;s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}
function celebrate(rows){
  modal(T('برافو عليك!','Well done!'),`<div class="confetti" aria-hidden="true">${Array.from({length:30},(_,k)=>`<i style="left:${(k*37)%100}%;background:${['var(--acc)','var(--acc2)','#E4572E','#29B37C','#3D7DD8'][k%5]};animation-delay:${(k%10)*.07}s"></i>`).join('')}</div>
    ${rows.map((r,k)=>`<div class="cele-row ${k===0?'lead':''}"><span class="ic" aria-hidden="true">${r.ic}</span><div><b>${r.t}</b><span>${r.s||''}</span></div></div>`).join('')}`,[{label:T('يلا نكمّل','Keep going'),cls:'primary'}]);
}
const PRAISE=[['💪','عاش يا بطل','That’s the spirit'],['🔥','كمّل كده، إنت ماشي صح','Keep going, you’re on track'],['⚡','ضربة قوية','Powerful hit'],['🎯','خطوة كمان لقدّام','One more step forward'],['🌟','ده اللي بيفرق','This is what makes the difference'],['🏅','إنت أقوى من الكسل','You’re stronger than laziness'],['🚀','شغل محترم','Solid work']];
function cheer(b,ev,label){
  const a=game(),dx=(a.xp+a.box)-(b.xp+b.box);
  if(dx&&ev&&ev.clientX!=null)floatXP(ev.clientX,ev.clientY,dx>0?`+${dx} XP`:`${dx} XP`);
  if(dx<=0)return;
  const rows=[];
  if(a.level>b.level)rows.push({ic:'🚀',t:T(`مستوى جديد: ${a.level}`,`New level: ${a.level}`),s:lvName(a.level)});
  if(a.bosses>b.bosses){const n=a.weeks.findIndex((w,k)=>w&&w.def&&!(b.weeks[k]||{}).def),k=n>0?n:ui.week,bo=bossOf(k);rows.push({ic:'⚔️',t:T(`هزمت ${bo.name}!`,`You defeated ${bo.name}!`),s:`+${(a.weeks[k]||{}).bounty||XP.boss} XP`})}
  if(a.perfect>b.perfect&&a.today&&a.today.q.all)rows.push({ic:'🎁',t:T('صندوق المفاجأة اتفتح','Mystery box opened'),s:T(`يوم كامل: +${XP.all} XP و+${a.today.box} عملة`,`Perfect day: +${XP.all} XP and +${a.today.box} coins`)});
  a.badges.filter(x=>!b.badges.includes(x)).forEach(id=>{const bd=BADGES.find(z=>z.id===id);rows.push({ic:bd.ic,t:T(`إنجاز جديد: ${bd.a}`,`New badge: ${bd.e}`),s:T(bd.da,bd.de)})});
  if(a.streak>b.streak&&a.today&&a.today.st==='hit')rows.push({ic:'🔥',t:T(`السلسلة اتأمنت: ${a.streak} يوم`,`Streak secured: ${a.streak} days`),s:T('النهارده اتحسب','Today counts')});
  if(!rows.length&&(state.game||{}).cele===false)return;
  const pr=PRAISE[(a.dCnt+a.todos)%PRAISE.length],y=a.today,W=a.weeks[ui.week];
  const sub=[label?esc(label):'',`+${dx} XP`].filter(Boolean).join(' · ');
  const base=[{ic:pr[0],t:T(pr[1],pr[2]),s:sub}];
  if(y&&y.p&&!y.q.all)base.push({ic:'📅',t:T(`النهارده: ${y.d} من ${y.p}`,`Today: ${y.d} of ${y.p}`),s:T(`فاضلك ${y.p-y.d} وتفتح صندوق المفاجأة`,`${y.p-y.d} more to open the mystery box`)});
  if(W&&W.hp&&!W.def&&!W.esc){const hl=Math.max(100-Math.round(W.pct/80*100),0);base.push({ic:'⚔️',t:T(`ضربت ${bossOf(ui.week).name}`,`You hit ${bossOf(ui.week).name}`),s:T(`صحته بقت ${hl}%`,`Its health is now ${hl}%`)})}
  setTimeout(()=>celebrate(rows.length?rows.concat(base.slice(0,1)):base),350);
}

/* size the print to A4 in the chosen orientation; one-page mode shrinks until everything fits */
function fitPage(P,o,one){
  const land=o.o!=='portrait',PW=land?1054:726,PH=(land?726:1054)*0.95,BW=land?1054:900,MINZ=0.5,zw=PW/BW;
  const set=z=>{P.style.cssText=`display:block;position:absolute;top:0;left:-99999px;width:${PW/z}px;zoom:1`;fitSlots(P)};
  let z=zw;
  if(one){
    for(let k=0;k<6;k++){set(z);const nz=Math.min(zw,PH/P.scrollHeight);if(Math.abs(nz-z)<.004){z=nz;break}z=nz}
    set(z);if(P.scrollHeight*z>PH){z=z*PH/(P.scrollHeight*z)*.99;set(z)}
    if(z<MINZ){z=zw;one=false;set(z)}
  }else set(z);
  P.classList.toggle('one-page',one&&P.scrollHeight*z<=PH+1);
  P.style.cssText=`width:${PW/z}px;zoom:${z}`;
}
